name: Audio des leçons
on:
  workflow_dispatch:
    inputs:
      cours:
        description: "Cours (finance, trading, perso, excel) séparés par des virgules"
        default: "finance,trading,perso,excel"
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        cours: [finance, trading, perso, excel]
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.inputs.cours, matrix.cours)
      - name: edge-tts
        if: contains(github.event.inputs.cours, matrix.cours)
        run: pip install -q edge-tts
      - name: Fabriquer l'audio
        if: contains(github.event.inputs.cours, matrix.cours)
        run: rm -rf audio/${{ matrix.cours }} audio/${{ matrix.cours }}.json && python outils/audio.py ${{ matrix.cours }} fr-FR-DeniseNeural
      - uses: actions/upload-artifact@v4
        if: contains(github.event.inputs.cours, matrix.cours)
        with:
          name: audio-${{ matrix.cours }}
          path: audio/
  publier:
    needs: voix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: tmp-audio
      - name: Publier sur le site
        run: |
          mkdir -p audio
          for a in tmp-audio/audio-*; do [ -d "$a" ] || continue; for c in "$a"/*/; do rm -rf "audio/$(basename "$c")"; done; cp -r "$a"/. audio/; done
          git config user.name "rosace-audio"
          git config user.email "rosace-audio@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Audio des leçons (voix neurale)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
