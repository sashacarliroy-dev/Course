, y compris la nuit de Noël.<\/li><li><strong>Elles sont extrêmement volatiles<\/strong> : le Bitcoin est passé d'environ 69 000 $ en novembre 2021 à environ 15 500 $ en novembre 2022, une chute de plus de 75 % en un an. Et il a connu des hausses tout aussi spectaculaires.<\/li><\/ol>\n<p>Volatilité veut dire <strong>opportunités, mais aussi pertes rapides<\/strong>. Pour un débutant, c'est le marché le plus piégeux : il bouge la nuit pendant que tu dors, et beaucoup de plateformes poussent à utiliser un levier énorme.<\/p>\n<h2>Les horaires : quand chaque marché est ouvert<\/h2>\n<p>Toutes les heures sont données <strong>en heure de Paris<\/strong>.<\/p>\n<table><thead><tr><th>Marché<\/th><th>Horaires (heure de Paris)<\/th><th>Remarque<\/th><\/tr><\/thead><tbody><tr><td><strong>Euronext Paris<\/strong> (actions françaises)<\/td><td>9 h 00 – 17 h 30, du lundi au vendredi<\/td><td>fixing de clôture juste après 17 h 30<\/td><\/tr><tr><td><strong>Xetra<\/strong> (actions allemandes)<\/td><td>9 h 00 – 17 h 30<\/td><td>même rythme que Paris<\/td><\/tr><tr><td><strong>NYSE / Nasdaq<\/strong> (actions américaines)<\/td><td>15 h 30 – 22 h 00<\/td><td>voir le piège du changement d'heure plus bas<\/td><\/tr><tr><td><strong>Forex<\/strong><\/td><td>du dimanche soir ~23 h au vendredi soir ~23 h, sans interruption<\/td><td>fermé le week-end<\/td><\/tr><tr><td><strong>Contrats à terme<\/strong> (indices, or, pétrole)<\/td><td>presque 24 h/24 en semaine<\/td><td>courte pause chaque jour<\/td><\/tr><tr><td><strong>Cryptos<\/strong><\/td><td>24 h/24, 7 j/7<\/td><td>jamais fermé<\/td><\/tr><\/tbody><\/table>\n<h3>Les sessions du forex<\/h3>\n<p>Le forex est ouvert 24 h/24, mais il n'est pas actif de la même façon à toute heure. Il suit le soleil autour du globe :<\/p>\n<ul><li><strong>Session asiatique<\/strong> (Tokyo, Sydney) : la nuit pour nous, plutôt calme sur l'EUR/USD.<\/li><li><strong>Session européenne<\/strong> (Londres) : à partir de 9 h environ, beaucoup plus active.<\/li><li><strong>Session américaine<\/strong> (New York) : à partir de 14 h environ.<\/li><\/ul>\n<p>Le moment le plus agité de la journée est le <strong>chevauchement Londres + New York, environ de 14 h à 18 h<\/strong> (heure de Paris). C'est là que les volumes sont les plus forts et que les grandes statistiques américaines tombent (souvent à 14 h 30).<\/p>\n<h3>Le piège du changement d'heure<\/h3>\n<p>L'Europe et les États-Unis ne changent pas d'heure le même jour. Pendant une à trois semaines au printemps et à l'automne, l'écart passe de 6 h à 5 h, et <strong>Wall Street ouvre à 14 h 30<\/strong> heure de Paris au lieu de 15 h 30.<\/p>\n<p>Exemple concret, tout proche : en 2026, l'Europe passe à l'heure d'hiver le <strong>25 octobre<\/strong>, les États-Unis le <strong>1er novembre<\/strong>. Entre ces deux dates, la bourse de New York ouvrira donc à <strong>14 h 30<\/strong> heure de Paris. Beaucoup de débutants se font surprendre chaque année.<\/p>\n<h3>Ouverture, clôture et « gaps »<\/h3>\n<p>Les marchés sont plus agités <strong>juste après l'ouverture<\/strong> et <strong>juste avant la clôture<\/strong> : c'est là que s'exécutent les ordres accumulés pendant la nuit et que les gros acteurs ajustent leurs positions.<\/p>\n<p>Quand une bourse ferme, les nouvelles continuent d'arriver (résultats publiés le soir, événements géopolitiques, séance américaine). Le lendemain matin, le prix peut donc ouvrir <strong>nettement plus haut ou plus bas<\/strong> que la clôture de la veille, sans passer par les prix intermédiaires. Ce saut s'appelle un <strong>gap<\/strong>.<\/p>\n<blockquote><p><strong>Pourquoi c'est dangereux<\/strong> : si tu gardes une position la nuit avec un ordre de protection (stop) à 100 €, et que l'action ouvre à 92 € le lendemain, ton ordre sera exécuté vers 92 €, pas à 100 €. Le gap a « sauté » par-dessus ton stop. On reverra ça en leçon 4.<\/p><\/blockquote>\n<h2>Quel marché pour toi ?<\/h2>\n<p>Il n'y a pas de bonne réponse universelle, mais quelques critères simples :<\/p>\n<table><thead><tr><th>Si tu...<\/th><th>Marchés adaptés<\/th><\/tr><\/thead><tbody><tr><td>es en cours toute la journée et libre le soir<\/td><td>actions américaines (15 h 30 – 22 h), en <strong>swing trading<\/strong><\/td><\/tr><tr><td>veux comprendre ce que tu trades<\/td><td>actions et indices que tu connais (CAC 40, entreprises françaises)<\/td><\/tr><tr><td>veux des mouvements plus « propres »<\/td><td>indices plutôt qu'actions isolées<\/td><\/tr><tr><td>débutes<\/td><td><strong>éviter<\/strong> au départ le forex avec levier et les cryptos, les plus piégeux<\/td><\/tr><\/tbody><\/table>\n<p>Pour un étudiant, une combinaison réaliste : analyser le soir, placer ses ordres à l'avance, et trader des <strong>actions ou des indices<\/strong> en <strong>swing trading<\/strong>. C'est la base qu'on utilisera dans les exemples des prochaines leçons.<\/p>\n<h2>À retenir<\/h2>\n<ul><li><strong>Actions<\/strong> : une part d'entreprise, chaque titre a son histoire et peut fortement bouger sur une nouvelle.<\/li><li><strong>Indices<\/strong> : un panier d'actions (CAC 40, S&amp;P 500...), tradé via ETF, futures ou CFD, plus stable qu'une action seule.<\/li><li><strong>Forex<\/strong> : le plus gros marché du monde, on trade des paires (EUR/USD), ouvert 24 h/24 en semaine, presque toujours avec levier.<\/li><li><strong>Matières premières<\/strong> : or, pétrole..., surtout via des contrats à terme, sensibles à la géopolitique.<\/li><li><strong>Cryptos<\/strong> : ouvertes 24 h/24 et 7 j/7, extrêmement volatiles.<\/li><li>Paris : <strong>9 h – 17 h 30<\/strong>. New York : <strong>15 h 30 – 22 h<\/strong> (14 h 30 pendant le décalage du changement d'heure).<\/li><li>Les <strong>gaps<\/strong> d'ouverture peuvent sauter par-dessus ton ordre de protection.<\/li><li>Choisis ton marché en fonction de <strong>ton emploi du temps<\/strong> et de ton niveau.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Il est <strong>16 h<\/strong> à Paris un mardi de janvier. Parmi ces marchés, lesquels sont ouverts ? Euronext Paris, NYSE, forex, Bitcoin.<\/li><li>Il est <strong>10 h<\/strong> à Paris un <strong>samedi<\/strong>. Même question.<\/li><li><strong>EUR/USD<\/strong> passe de <strong>1,0850<\/strong> à <strong>1,0920<\/strong>. L'euro s'est-il apprécié ou déprécié face au dollar ? De combien de pips a-t-il bougé ?<\/li><li>Tu es en cours de <strong>8 h à 18 h<\/strong>, puis libre de <strong>19 h à 23 h<\/strong>. Quel marché d'actions peux-tu suivre en direct ? À quelle heure de Paris ouvrira-t-il le <strong>28 octobre 2026<\/strong> ?<\/li><li>Une action clôture vendredi à <strong>50 €<\/strong>. Tu as un ordre de protection pour vendre à <strong>47 €<\/strong>. Pendant le week-end, l'entreprise annonce un scandale, et l'action ouvre lundi à <strong>41 €<\/strong>. À quel prix ta vente s'exécute-t-elle à peu près, et combien perds-tu par action par rapport à ce que tu avais prévu ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li><strong>Les quatre sont ouverts<\/strong> : Euronext (9 h – 17 h 30), le NYSE a ouvert à 15 h 30, le forex tourne en continu en semaine, et le Bitcoin ne ferme jamais. C'est d'ailleurs le créneau le plus actif de la journée (chevauchement Europe / États-Unis).<\/li><li><strong>Seul le Bitcoin<\/strong> (et les autres cryptos). Les bourses et le forex sont fermés le week-end.<\/li><li>Le prix de l'euro en dollars a <strong>monté<\/strong>, donc l'euro s'est <strong>apprécié<\/strong> face au dollar. Variation : 1,0920 − 1,0850 = 0,0070, soit <strong>70 pips<\/strong> (1 pip = 0,0001). En pourcentage : 0,0070 / 1,0850 ≈ <strong>0,65 %<\/strong>, ce qui est déjà un mouvement notable pour une devise.<\/li><li>Les <strong>actions américaines<\/strong> (NYSE, Nasdaq), ouvertes jusqu'à 22 h heure de Paris. Le 28 octobre 2026, l'Europe est déjà à l'heure d'hiver (depuis le 25) mais pas les États-Unis (le 1er novembre) : Wall Street ouvrira donc à <strong>14 h 30<\/strong> heure de Paris. Pour toi, ça ne change rien, puisque tu arrives à 19 h.<\/li><li>Le marché ouvre directement à 41 €, sans jamais passer par 47 € : ton ordre se déclenche et s'exécute <strong>vers 41 €<\/strong> (ou un peu plus bas). Tu pensais perdre au maximum 3 € par action (50 − 47), tu perds en réalité environ <strong>9 €<\/strong> (50 − 41), <strong>trois fois plus que prévu<\/strong>. C'est le risque de gap, et une raison de plus pour ne jamais engager trop gros sur une seule position.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : comment se forme un prix. Le carnet d'ordres, le bid, l'ask, le spread et la liquidité.<\/em><\/p>", "minutes": 13}, "3": {"titre": "Comment se forme un prix", "html": "<h2>Pourquoi c'est important<\/h2>\n<p>Sur ton application, tu vois « Airbus : 150,00 € ». Ce chiffre a l'air simple, presque officiel. En réalité, il n'existe pas de « prix d'Airbus » unique : il y a, à chaque instant, des gens prêts à acheter un peu moins cher, et des gens prêts à vendre un peu plus cher. Le prix, c'est simplement <strong>le dernier endroit où un acheteur et un vendeur se sont mis d'accord<\/strong>. Comprendre ce mécanisme t'évitera de payer des frais cachés sans le savoir, et t'expliquera pourquoi ton ordre ne s'exécute pas toujours au prix que tu voyais.<\/p>\n<h2>Le carnet d'ordres : la file d'attente des acheteurs et des vendeurs<\/h2>\n<p>Sur une bourse comme Euronext, tous les ordres en attente sont rangés dans un <strong>carnet d'ordres<\/strong> (<em>order book<\/em>). D'un côté, les acheteurs avec le prix maximum qu'ils acceptent de payer. De l'autre, les vendeurs avec le prix minimum qu'ils acceptent de recevoir.<\/p>\n<p>Voici un carnet <strong>simplifié et fictif<\/strong> pour une action :<\/p>\n<table><thead><tr><th>Acheteurs : quantité<\/th><th>Acheteurs : prix<\/th><th><\/th><th>Vendeurs : prix<\/th><th>Vendeurs : quantité<\/th><\/tr><\/thead><tbody><tr><td>300<\/td><td><strong>149,95 €<\/strong><\/td><td><\/td><td><strong>150,00 €<\/strong><\/td><td>200<\/td><\/tr><tr><td>500<\/td><td>149,90 €<\/td><td><\/td><td>150,05 €<\/td><td>400<\/td><\/tr><tr><td>800<\/td><td>149,85 €<\/td><td><\/td><td>150,10 €<\/td><td>600<\/td><\/tr><tr><td>1 200<\/td><td>149,80 €<\/td><td><\/td><td>150,15 €<\/td><td>900<\/td><\/tr><\/tbody><\/table>\n<p>Comment le lire :<\/p>\n<ul><li>La <strong>meilleure offre d'achat<\/strong> est à 149,95 € : quelqu'un veut acheter 300 actions à ce prix, pas plus cher. C'est le <strong>bid<\/strong>.<\/li><li>La <strong>meilleure offre de vente<\/strong> est à 150,00 € : quelqu'un veut vendre 200 actions à ce prix, pas moins cher. C'est l'<strong>ask<\/strong> (ou <em>offer<\/em>).<\/li><li>Tant que personne ne cède, <strong>il ne se passe rien<\/strong> : les acheteurs attendent en dessous, les vendeurs au-dessus.<\/li><\/ul>\n<p>Une transaction a lieu quand quelqu'un <strong>accepte le prix de l'autre camp<\/strong>. Si un acheteur pressé accepte de payer 150,00 €, il achète au vendeur le moins cher. Le « prix » affiché devient alors 150,00 €.<\/p>\n<h2>Bid, ask et spread<\/h2>\n<blockquote><p><strong>Bid<\/strong> = le meilleur prix auquel tu peux <strong>vendre<\/strong> tout de suite (le prix que les acheteurs offrent).<\/p><p><strong>Ask<\/strong> = le meilleur prix auquel tu peux <strong>acheter<\/strong> tout de suite (le prix que les vendeurs demandent).<\/p><p><strong>Spread<\/strong> = Ask − Bid.<\/p><\/blockquote>\n<p>Dans notre exemple : spread = 150,00 − 149,95 = <strong>0,05 €<\/strong>, soit environ <strong>0,03 %<\/strong> du prix.<\/p>\n<p>Pourquoi c'est un coût ? Imagine que tu achètes immédiatement 100 actions à l'ask (150,00 €), puis que tu changes d'avis et revends tout de suite au bid (149,95 €). Le prix n'a pas bougé, et pourtant tu as perdu 100 × 0,05 = <strong>5 €<\/strong>, sans compter les frais de courtage. <strong>Le spread, c'est le prix de l'impatience<\/strong> : celui qui veut être servi tout de suite le paie à celui qui accepte d'attendre.<\/p>\n<p>C'est pour ça qu'on dit qu'une position démarre toujours <strong>légèrement en perte<\/strong> : tu achètes à l'ask, mais ta position est évaluée au prix auquel tu pourrais la revendre, le bid.<\/p>\n<h3>Le spread chez les courtiers en CFD et en forex<\/h3>\n<p>Beaucoup de courtiers affichent « 0 € de commission ». Ils se rémunèrent alors en partie sur le spread, qu'ils élargissent un peu. Le spread devient ta commission cachée. Avant de choisir un courtier (leçon 5), compare toujours <strong>les spreads réels<\/strong>, pas seulement les frais affichés.<\/p>\n<h2>La liquidité : la profondeur du marché<\/h2>\n<p>Un marché est <strong>liquide<\/strong> quand il y a beaucoup d'acheteurs et de vendeurs, avec de grosses quantités, à des prix très proches. Concrètement, ça donne :<\/p>\n<ul><li>un <strong>spread serré<\/strong> (petit) ;<\/li><li>un carnet <strong>profond<\/strong> (beaucoup de quantité à chaque niveau de prix) ;<\/li><li>la possibilité d'acheter ou vendre de grosses quantités <strong>sans faire bouger le prix<\/strong>.<\/li><\/ul>\n<table><thead><tr><th>Exemple<\/th><th>Liquidité<\/th><th>Spread typique<\/th><\/tr><\/thead><tbody><tr><td>EUR/USD en pleine journée<\/td><td>énorme<\/td><td>très faible<\/td><\/tr><tr><td>Grande action du CAC 40 (TotalEnergies, LVMH)<\/td><td>forte<\/td><td>souvent un seul cran de cotation<\/td><\/tr><tr><td>Petite entreprise peu échangée<\/td><td>faible<\/td><td>peut dépasser 1 % du prix<\/td><\/tr><tr><td>Petite cryptomonnaie obscure<\/td><td>très faible<\/td><td>peut être énorme, et variable<\/td><\/tr><\/tbody><\/table>\n<p>La liquidité <strong>change dans la journée<\/strong> : elle est plus faible juste à l'ouverture, en fin de soirée, pendant les vacances et la nuit pour le forex. Le spread s'élargit alors. Pendant une annonce importante (une décision de la Fed, des résultats d'entreprise), les vendeurs et acheteurs retirent souvent leurs ordres du carnet par prudence : le spread peut s'écarter brutalement pendant quelques secondes ou quelques minutes.<\/p>\n<h2>Quand ton ordre « traverse » le carnet : le slippage<\/h2>\n<p>Reprends notre carnet. Tu veux acheter <strong>800 actions tout de suite<\/strong>, au prix du marché. Il n'y a que 200 actions à 150,00 €. Ton ordre va donc « manger » plusieurs niveaux :<\/p>\n<table><thead><tr><th>Niveau<\/th><th>Quantité prise<\/th><th>Prix<\/th><th>Coût<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>200<\/td><td>150,00 €<\/td><td>30 000 €<\/td><\/tr><tr><td>2<\/td><td>400<\/td><td>150,05 €<\/td><td>60 020 €<\/td><\/tr><tr><td>3<\/td><td>200<\/td><td>150,10 €<\/td><td>30 020 €<\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td><strong>800<\/strong><\/td><td><\/td><td><strong>120 040 €<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>Ton <strong>prix moyen<\/strong> est 120 040 / 800 = <strong>150,05 €<\/strong>, et non 150,00 € comme affiché. Cet écart entre le prix que tu voyais et le prix que tu obtiens s'appelle le <strong>slippage<\/strong> (glissement).<\/p>\n<p>Sur une grosse action très liquide, avec les montants d'un étudiant, le slippage est presque toujours négligeable. Il devient important :<\/p>\n<ul><li>sur les <strong>petites valeurs<\/strong> peu échangées ;<\/li><li>pendant les <strong>annonces<\/strong> et les moments de panique ;<\/li><li>quand ton ordre de protection se déclenche dans un marché qui chute vite (on l'a vu avec les gaps en leçon 2).<\/li><\/ul>\n<h2>Qui sont les acteurs du carnet ?<\/h2>\n<ul><li><strong>Les teneurs de marché<\/strong> (<em>market makers<\/em>) : des sociétés spécialisées qui placent en permanence des ordres d'achat et de vente des deux côtés du carnet. Ils gagnent le spread des milliers de fois par jour, et en échange ils apportent de la liquidité.<\/li><li><strong>Les institutionnels<\/strong> : fonds, banques, assureurs. Ils achètent ou vendent de très grosses quantités, souvent découpées en petits morceaux par des algorithmes pour ne pas faire bouger le prix.<\/li><li><strong>Les traders haute fréquence<\/strong> : des algorithmes qui réagissent en microsecondes.<\/li><li><strong>Les particuliers<\/strong> : toi. Une goutte d'eau dans l'océan, ce qui a un avantage : tes ordres ne font pas bouger le marché.<\/li><\/ul>\n<h2>Pourquoi le prix bouge vraiment<\/h2>\n<p>Le prix monte quand <strong>les acheteurs sont plus pressés que les vendeurs<\/strong> : ils acceptent les prix demandés et « mangent » les ordres de vente, niveau après niveau. Le prix baisse quand ce sont les vendeurs qui sont pressés et qui acceptent les prix offerts par les acheteurs.<\/p>\n<p>Une bonne nouvelle (des résultats meilleurs que prévu, par exemple) ne fait pas monter le prix par magie : elle donne envie à beaucoup de gens d'acheter <strong>tout de suite<\/strong>, pendant que les vendeurs relèvent leurs prix. C'est ce déséquilibre entre acheteurs pressés et vendeurs pressés que les graphiques enregistrent, et que tu apprendras à lire au module 2.<\/p>\n<h2>À retenir<\/h2>\n<ul><li>Le prix affiché est le <strong>dernier prix d'échange<\/strong>, pas un prix unique et fixe.<\/li><li>Le <strong>carnet d'ordres<\/strong> range les acheteurs (en dessous) et les vendeurs (au-dessus).<\/li><li><strong>Bid<\/strong> = prix auquel tu peux vendre tout de suite. <strong>Ask<\/strong> = prix auquel tu peux acheter tout de suite. <strong>Spread<\/strong> = ask − bid.<\/li><li>Le spread est un <strong>coût<\/strong> que tu paies à chaque aller-retour : une position démarre toujours légèrement en perte.<\/li><li>Un marché <strong>liquide<\/strong> a un spread serré et un carnet profond. La liquidité baisse à l'ouverture, la nuit et pendant les annonces.<\/li><li>Un gros ordre au marché peut « traverser » plusieurs niveaux : c'est le <strong>slippage<\/strong>.<\/li><li>Le prix monte quand les <strong>acheteurs sont plus pressés<\/strong> que les vendeurs, et inversement.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Une action affiche : <strong>bid 42,10 €<\/strong>, <strong>ask 42,14 €<\/strong>. Quel est le spread en euros et en pourcentage du prix (prends l'ask comme base) ?<\/li><li>Tu achètes <strong>250 actions<\/strong> au marché, puis tu les revends immédiatement au marché. Combien perds-tu à cause du spread seul ?<\/li><li>Avec le carnet de la leçon, tu veux <strong>vendre 1 000 actions<\/strong> immédiatement au marché. Calcule ton prix moyen de vente et le slippage par rapport au bid affiché (149,95 €).<\/li><li>Deux actions coûtent environ 20 €. L'action <strong>A<\/strong> a un spread de 0,01 €, l'action <strong>B<\/strong> un spread de 0,30 €. Tu comptes faire 30 allers-retours par an de 2 000 € sur l'une d'elles. Combien te coûte le spread sur un an pour chacune ?<\/li><li><strong>Question de réflexion<\/strong> : la Fed publie une décision importante à 20 h heure de Paris. Pourquoi est-ce une mauvaise idée de passer un ordre au marché sur l'EUR/USD à 19 h 59 ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li>Spread = 42,14 − 42,10 = <strong>0,04 €<\/strong>. En pourcentage : 0,04 / 42,14 ≈ <strong>0,095 %<\/strong>, soit à peu près 0,1 %.<\/li><li>Tu achètes à 42,14 € et revends à 42,10 € : 250 × 0,04 = <strong>10 €<\/strong> perdus, uniquement à cause du spread (avant frais de courtage).<\/li><li>Tu vends en « mangeant » les acheteurs du haut vers le bas : 300 à 149,95 € = 44 985 € ; 500 à 149,90 € = 74 950 € ; il reste 200 à 149,85 € = 29 970 €. Total : 149 905 € pour 1 000 actions, soit un prix moyen de <strong>149,905 €<\/strong>. Slippage : 149,95 − 149,905 = <strong>0,045 € par action<\/strong>, soit <strong>45 €<\/strong> au total par rapport au prix affiché.<\/li><li>Avec 2 000 € à 20 €, tu trades 100 actions. Coût du spread par aller-retour : A = 100 × 0,01 = 1 € ; B = 100 × 0,30 = 30 €. Sur 30 allers-retours : <strong>A = 30 €<\/strong>, <strong>B = 900 €<\/strong> par an. Même stratégie, même capital, et 870 € d'écart juste à cause de la liquidité. Les actions peu liquides coûtent très cher à trader souvent.<\/li><li>Juste avant une grosse annonce, les teneurs de marché retirent une partie de leurs ordres : le <strong>spread s'élargit<\/strong> et le carnet devient mince. Ton ordre au marché peut s'exécuter à un prix bien moins bon que prévu. Et une seconde après l'annonce, le prix peut bondir dans n'importe quel sens. Règle simple pour débuter : <strong>pas d'ordre au marché juste avant ou juste après une annonce majeure<\/strong>.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : les types d'ordres. Ordre au marché, ordre limite, stop et stop-limite, et lequel utiliser selon la situation.<\/em><\/p>", "minutes": 13}}}</script>

/* Décor du bandeau : rosace (finance) ou bougies (trading) */
function deco() {
  const cv = $("deco"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--hero-ink").trim();
  if (coursActif === "finance") {
    const R = Math.min(W, H) * 0.75, cx = W * 0.82, cy = H * 0.55;
    g.lineWidth = 0.6;
    for (let k = 0; k < 2; k++) {
      g.strokeStyle = k ? "#f2c14e" : ink; g.globalAlpha = k ? 0.35 : 0.18;
      const [a, b, f, p] = k ? [R * 0.55, R * 0.16, 13, 7] : [R * 0.75, R * 0.16, 19, 11];
      for (let r = 0; r < p; r++) {
        g.beginPath();
        for (let t = 0; t <= Math.PI * 2 + 0.01; t += 0.006) {
          const rr = a + b * Math.sin(f * t + r * Math.PI * 2 / p) * (0.6 + 0.4 * Math.cos(3 * t));
          const x = cx + rr * Math.cos(t), y = cy + rr * Math.sin(t); t ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
    }
  } else {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const N = Math.max(24, Math.round(W / 22)), bars = []; let p = 100;
    for (let i = 0; i < N; i++) { const drift = i < N * .4 ? 1.2 : i < N * .55 ? -1.8 : 1.9; const o = p, cl = o + drift + (rnd() - .5) * 5;
      bars.push({ o, c: cl, h: Math.max(o, cl) + rnd() * 2.5, l: Math.min(o, cl) - rnd() * 2.5 }); p = cl; }
    const lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h));
    const y = v => H * 0.95 - (v - lo) / (hi - lo) * H * 0.7, step = W / N;
    bars.forEach((b, i) => { const x = i * step + step / 2; g.globalAlpha = 0.28;
      g.strokeStyle = g.fillStyle = b.c >= b.o ? "#6cc79a" : "#ef8b85"; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(x, y(b.h)); g.lineTo(x, y(b.l)); g.stroke();
      g.fillRect(x - step * .3, y(Math.max(b.o, b.c)), step * .6, Math.max(1.5, Math.abs(y(b.o) - y(b.c)))); });
    g.globalAlpha = 0.6; g.strokeStyle = "#f2c14e"; g.lineWidth = 2; g.beginPath();
    bars.forEach((b, i) => { const s = bars.slice(Math.max(0, i - 4), i + 1), v = s.reduce((a, q) => a + q.c, 0) / s.length; const x = i * step + step / 2; i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
    g.stroke();
  }
}

  const P = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.75, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  (function f(t) {

    for (const p of P) { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); }
    if (t - t0 < 2200) requestAnimationFrame(f); else g.clearRect(0, 0, innerWidth, innerHeight);

}

/* Rendu Markdown léger + quiz interactif */
function inline(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(src) {
  const quizzes = [];
  src = src.replace(/```quiz\s*([\s\S]*?)(```|$)/g, (_, j, fin) => { quizzes.push({ j, complet: !!fin }); return "\n\n@@QUIZ" + (quizzes.length - 1) + "@@\n\n"; });
  const blocs = []; src = src.replace(/```\w*\n?([\s\S]*?)(```|$)/g, (_, code) => { blocs.push(code); return "\n\n@@CODE" + (blocs.length - 1) + "@@\n\n"; });
  const html = src.trim().split(/\n{2,}/).map(b => {
    let mm;
    if ((mm = b.match(/^@@QUIZ(\d+)@@$/))) return `<div data-quiz="${mm[1]}"></div>`;
    if ((mm = b.match(/^@@CODE(\d+)@@$/))) return `<pre><code>${esc(blocs[mm[1]])}</code></pre>`;
    const l = b.split("\n");
    if (l.length >= 2 && /^\s*\|/.test(l[0]) && /^\s*\|?\s*:?-{2,}/.test(l[1])) {
      const cells = x => x.trim().replace(/^\||\|$/g, "").split("|").map(s => inline(s.trim()));
      return "<table><thead><tr>" + cells(l[0]).map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" + l.slice(2).map(r => "<tr>" + cells(r).map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
    }
    if (l.every(x => /^\s*[-•*] /.test(x))) return "<ul>" + l.map(x => "<li>" + inline(x.replace(/^\s*[-•*] /, "")) + "</li>").join("") + "</ul>";
    if (l.every(x => /^\s*\d+[.)] /.test(x))) return "<ol>" + l.map(x => "<li>" + inline(x.replace(/^\s*\d+[.)] /, "")) + "</li>").join("") + "</ol>";
    if (/^#{1,4} /.test(l[0]) && l.length === 1) return "<h4>" + inline(l[0].replace(/^#{1,4} /, "")) + "</h4>";
    return "<p>" + l.map(x => inline(x.replace(/^#{1,4} /, ""))).join("<br>") + "</p>";
  }).join("");
  return { html, quizzes };
}
function rendreIA(b, texte, final) {

}
function monterQuiz(slot, questions) {
  const n = leconCourante, cours = coursActif; let bons = 0, repondu = 0;
  questions.forEach((q, i) => {
    const box = document.createElement("div"); box.className = "quiz";
    box.innerHTML = `<div class="q"><span>${i + 1}/${questions.length}</span>${inline(q.q)}</div>` + q.choix.map((c, k) => `<button type="button" class="choix" data-k="${k}">${inline(c)}</button>`).join("") + '<div class="expl" hidden></div>';
    box.querySelectorAll(".choix").forEach(btn => btn.onclick = () => {
      const k = Number(btn.dataset.k), ok = k === q.bonne;
      box.querySelectorAll(".choix").forEach(x => { x.disabled = true; if (Number(x.dataset.k) === q.bonne) x.classList.add("bon"); });
      if (!ok) btn.classList.add("faux");
      const e = box.querySelector(".expl"); e.hidden = false; e.innerHTML = (ok ? "<strong>Bien vu !</strong> " : "<strong>Pas tout à fait.</strong> ") + inline(q.explication || "");
      repondu++; if (ok) bons++;
      if (repondu === questions.length) {
        const s = document.createElement("div"); s.className = "score";
        s.textContent = bons === questions.length ? `Sans faute : ${bons}/${questions.length} 🎯` : bons >= questions.length / 2 ? `${bons}/${questions.length}, c'est bien ! Relis les explications.` : `${bons}/${questions.length} : on revoit ça ensemble ? Demande-moi d'expliquer.`;
        slot.appendChild(s);
        if (n) {
          const avant = etat.quiz[cours][n];
          if (!avant || bons >= avant.bons) etat.quiz[cours][n] = { bons, total: questions.length, fait: jourISO() };
          else avant.fait = jourISO();
          sauver(); syncEnvoyer(cours, n);
        }
        marquerJour();
        if (bons) celebrer("+" + bons * 5 + " XP", "Quiz : " + bons + "/" + questions.length);
        $("fil").scrollTop = 1e9;
      }
    });
    slot.appendChild(box);
  });
}

function bulle(cls, html) { const b = document.createElement("div"); b.className = "bulle " + cls; b.innerHTML = html; $("fil").appendChild(b); $("fil").scrollTop = 1e9; return b; }
function afficherFil() {
  $("fil").innerHTML = "";
  if (!tours.length) {
    const c = COURS[coursActif];
    $("fil").innerHTML = `<div class="accueil-ia"><div class="avatar">${ICO.prof}</div><b>${esc(c.prof)}</b>Une notion pas claire, un calcul qui coince ? Écris ta question ou choisis un raccourci en bas. Je connais ${leconCourante ? "la leçon que tu lis" : "tout le programme"} et ce que tu as déjà fait.<br><br>Astuce : sélectionne un passage de la leçon pour me demander de l'expliquer.</div>`;
    return;
  }
  for (const t of tours) {
    if (t.role === "user") bulle("moi", esc(t.content).replace(/\n/g, "<br>"));
    else { const b = bulle("ia", ""); rendreIA(b, t.content, true); b.querySelectorAll(".quiz .choix").forEach(x => x.disabled = false); }
  }
}

/* Appel au prof : Supabase (site GitHub) ou Claude (si la page tourne dans claude.ai) */
async function appelerProf(systeme, messages, onText, signal) {
  if (SB) {
    const r = await fetch(SB.url + "/functions/v1/prof", { method: "POST", headers: sbHeaders(), body: JSON.stringify({ systeme, messages }), signal });
    if (!r.ok || !r.body) { let msg = ""; try { msg = (await r.json()).erreur; } catch (e) {} throw { code: "http_" + r.status, message: msg }; }
    const lecteur = r.body.getReader(), dec = new TextDecoder(); let tampon = "", texte = "", stop = "";
    for (;;) {
      const { value, done } = await lecteur.read(); if (done) break;
      tampon += dec.decode(value, { stream: true });
      let i; while ((i = tampon.indexOf("\n\n")) >= 0) {
        const evt = tampon.slice(0, i); tampon = tampon.slice(i + 2);
        const ligne = evt.split("\n").find(x => x.startsWith("data:")); if (!ligne) continue;
        let j; try { j = JSON.parse(ligne.slice(5)); } catch (e) { continue; }
        if (j.type === "content_block_delta" && j.delta && j.delta.text) { texte += j.delta.text; onText(texte); }
        else if (j.type === "message_delta" && j.delta) stop = j.delta.stop_reason || stop;
        else if (j.type === "error") throw { code: "api", message: j.error && j.error.message, text: texte };
      }
    }
    return { text: texte, truncated: stop === "max_tokens" };
  }
  return sample([{ role: "user", content: systeme + "\n\nLa conversation commence maintenant." }, ...messages], { cache: false, signal, onText: ({ text }) => onText(text) });
}
async function demander(q) {
  q = q.trim(); if (!q || enCours || !profDispo()) return;
  if (!tours.length) $("fil").innerHTML = "";
  enCours = true; $("envoyer").innerHTML = ICO.stop; $("envoyer").setAttribute("aria-label", "Arrêter"); $("question").value = ""; autoTaille();
  bulle("moi", esc(q).replace(/\n/g, "<br>"));
  tours.push({ role: "user", content: q });
  const j = jourISO(); etat.questions[j] = (etat.questions[j] || 0) + 1; marquerJour(); sauver();
  const b = bulle("ia", '<span class="points"><i></i><i></i><i></i></span>');
  ctl = new AbortController();
  try {
    const { text, truncated } = await appelerProf(consignes(), tours.slice(-12), t => { rendreIA(b, t, false); $("fil").scrollTop = 1e9; }, ctl.signal);
    rendreIA(b, text, true);
    if (truncated) b.insertAdjacentHTML("beforeend", '<div class="note">Réponse coupée : demande « la suite ».</div>');
    tours.push({ role: "assistant", content: text }); ecrire(cleConv(), tours.slice(-30));
  } catch (e) {
    tours.pop();
    const code = e && (e.code || e.name);
    if (code === "AbortError" || code === "cancelled") { if (e.text) rendreIA(b, e.text, true); else b.remove(); }
    else {
      const msg = { http_401: "La clé Supabase est refusée : vérifie les réglages en haut de index.html.", http_404: "La fonction « prof » n'est pas encore déployée sur Supabase.", http_429: "Trop de questions d'un coup. Réessaie dans une minute.", http_500: (e.message || "Le prof a eu un souci côté serveur."), rate_limited: "Limite d'usage atteinte. Réessaie plus tard." }[code]
        || (e && e.message) || "La réponse a été interrompue. Renvoie ta question.";
      b.innerHTML = '<div class="note">' + esc(msg) + "</div>";
    }
  } finally { enCours = false; ctl = null; $("envoyer").innerHTML = ICO.envoyer; $("envoyer").setAttribute("aria-label", "Envoyer"); }
}
function majModes() {
  const modes = leconCourante ? MODES_LECON : MODES_ACCUEIL;
  $("modes").innerHTML = modes.map((m, i) => `<button type="button" data-i="${i}">${m.ico}${esc(m.t)}</button>`).join("");
  $("modes").querySelectorAll("button").forEach(b => b.onclick = () => {
    const m = modes[Number(b.dataset.i)];
    if (m.saisie) { $("question").value = m.saisie; $("question").focus(); autoTaille(); } else demander(m.q);
  });
}
function ouvrirProf(question) {
  if (!profDispo()) { toast("Le prof IA s'active une fois Supabase configuré."); return; }
  $("prof").hidden = false; $("voile").hidden = false; $("ouvrir-prof").hidden = true;
  $("nom-prof").textContent = COURS[coursActif].prof;
  $("prof-contexte").textContent = leconCourante ? "Leçon " + leconCourante + " · " + titreDe(leconCourante) : "Programme complet · " + COURS[coursActif].nom;
  $("question").placeholder = COURS[coursActif].exemple;
  afficherFil(); majModes();
  if (question) demander(question); else if (matchMedia("(min-width: 721px)").matches) setTimeout(() => $("question").focus(), 60);
}
function fermerProf() { $("prof").hidden = true; $("voile").hidden = true; majProf(); }
function majProf() {
  $("ouvrir-prof").hidden = !profDispo() || !$("prof").hidden;
  const qe = document.getElementById("quiz-eclair"); if (qe) qe.hidden = !profDispo();
}
function autoTaille() { const t = $("question"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
$("ouvrir-prof").onclick = () => ouvrirProf();
$("fermer-prof").onclick = fermerProf;
$("voile").onclick = fermerProf;
$("nouvelle-conv").onclick = () => { if (enCours && ctl) ctl.abort(); tours = []; ecrire(cleConv(), []); afficherFil(); };
$("question").addEventListener("input", autoTaille);
$("saisie").addEventListener("submit", e => { e.preventDefault(); if (enCours) { ctl && ctl.abort(); return; } demander($("question").value); });
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(min-width: 721px)").matches) { e.preventDefault(); $("saisie").requestSubmit(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("prof").hidden) fermerProf(); if (!$("reglages").hidden) $("reglages").hidden = true; } });

/* Expliquer un passage sélectionné */
let passage = "";
document.addEventListener("selectionchange", () => {
  const sel = getSelection(), btn = $("expliquer"), txt = sel ? sel.toString().trim() : "";
  if (!profDispo() || !leconCourante || txt.length < 3 || !sel.rangeCount || !sel.anchorNode || !sel.anchorNode.parentElement?.closest("article.cours")) { btn.hidden = true; return; }
  passage = txt.slice(0, 1200);
  const r = sel.getRangeAt(0).getBoundingClientRect();
  btn.hidden = false;
  btn.style.top = (scrollY + r.bottom + 8) + "px";
  btn.style.left = Math.max(8, Math.min(scrollX + r.left, scrollX + document.documentElement.clientWidth - btn.offsetWidth - 8)) + "px";
});
$("expliquer").addEventListener("mousedown", e => e.preventDefault());
$("expliquer").addEventListener("click", () => { $("expliquer").hidden = true; ouvrirProf("Peux-tu m'expliquer ce passage de la leçon ?\n\n« " + passage + " »"); });

/* =========================================================
   9. Réglages : thème + code de progression
   ========================================================= */
let theme = lire("theme", "auto");
function appliquerTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  document.querySelectorAll("#seg-theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === theme)));
  deco();
}
document.querySelectorAll("#seg-theme button").forEach(b => b.onclick = () => { theme = b.dataset.t; ecrire("theme", theme); appliquerTheme(); });
$("btn-reglages").onclick = () => {
  $("code-sync").value = eleve; $("coller-code").value = "";
  $("etat-sync").textContent = SB ? "Synchronisation en ligne activée (Supabase)." : "Synchronisation pas encore activée : ta progression reste dans ce navigateur. Remplis les réglages Supabase en haut de index.html pour l'activer.";
  $("reglages").hidden = false;
};
$("fermer-reglages").onclick = () => { $("reglages").hidden = true; };
$("reglages").onclick = e => { if (e.target === $("reglages")) $("reglages").hidden = true; };
$("copier-code").onclick = async () => { try { await navigator.clipboard.writeText(eleve); toast("Code copié"); } catch (e) { $("code-sync").select(); } };
$("valider-code").onclick = async () => {
  const v = $("coller-code").value.trim(); if (v.length < 8) { $("etat-sync").textContent = "Ce code semble incomplet."; return; }
  if (!SB) { $("etat-sync").textContent = "Il faut d'abord activer Supabase."; return; }
  eleve = v; ecrire("eleve", eleve); $("code-sync").value = eleve;
  $("etat-sync").textContent = "Récupération…";
  const ok = await syncRecevoir();
  $("etat-sync").textContent = ok ? "Progression récupérée ✓" : "Impossible de récupérer la progression.";
  rafraichir();
};

/* =========================================================
   10. Navigation : #finance, #trading/lecon-03
   ========================================================= */
function majSwitch() {
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cours === coursActif)));
  for (const c of ["finance", "trading"]) { const d = DATA[c]; $("sw-" + c).textContent = d ? Math.round(d.dispo.filter(x => estLue(x, c)).length / d.total * 100) + "%" : ""; }
  const s = serie(); $("flamme-mini").innerHTML = ICO.flamme + s; $("flamme-mini").title = s + " jour(s) d'affilée";
}
async function changerCours(c) {
  if (c === coursActif && DATA[c]) return;
  coursActif = c; ecrire("cours", c); document.documentElement.dataset.cours = c;
  tours = lire(cleConv(), []);
  majSwitch();
  if (!DATA[c]) { $("accueil").innerHTML = '<div class="chargement">Chargement du cours…</div>'; try { await charger(c); } catch (e) { $("accueil").innerHTML = '<div class="chargement">Impossible de charger le cours. Vérifie ta connexion puis recharge la page.</div>'; return false; } }
  return true;
}
document.querySelectorAll(".switch button").forEach(b => b.onclick = () => { location.hash = "#" + b.dataset.cours; });
$("lien-accueil").onclick = e => { e.preventDefault(); location.hash = "#" + coursActif; };

async function route() {
  let h = location.hash.replace(/^#/, "");
  let mm = h.match(/^(finance|trading)(?:\/lecon-(\d+))?$/) || h.match(/^lecon-(\d+)$/) && [null, coursActif, h.match(/^lecon-(\d+)$/)[1]];
  const c = mm && mm[1] ? mm[1] : coursActif;
  if (await changerCours(c) === false) return;
  const n = mm && mm[2] ? Number(mm[2]) : 0;
  const ok = n && D().lecons[n];
  $("accueil").hidden = !!ok; $("lecture").hidden = !ok;
  leconCourante = ok ? n : 0;
  if (!$("prof").hidden) fermerProf();
  ok ? lecture(n) : accueil();
  $("expliquer").hidden = true;
  majSwitch(); majProf(); barreLecture();
  if (h.endsWith("programme")) document.getElementById("programme")?.scrollIntoView(); else scrollTo(0, 0);
}
function rafraichir() { if (leconCourante) lecture(leconCourante); else accueil(); majSwitch(); }
addEventListener("hashchange", route);
addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(deco, 150); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", deco);

/* =========================================================
   11. Démarrage
   ========================================================= */
document.documentElement.dataset.cours = coursActif;
appliquerTheme();
(async () => {
  try { if (!SB && window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
  await route();
  charger(coursActif === "finance" ? "trading" : "finance").then(majSwitch).catch(() => {});
  if (await syncRecevoir()) rafraichir();
  document.fonts && document.fonts.ready.then(deco);
})();
