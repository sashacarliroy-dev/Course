<style>
/* =========================================================
   Thème : une base papier/encre commune, et chaque cours
   apporte sa couleur (data-cours sur <html>).
   ========================================================= */
:root {
  --paper: #f5f3ec; --surface: #fffdf8; --ink: #182520; --muted: #5d6963; --line: #ddd8cb; --soft: #ece8dc;
  --gold: #c28a1c; --gold-soft: #f6e6bf; --flame: #e2602a;
  --up: #1f8a5a; --down: #c2413b;
  --f-display: "Young Serif", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow: 0 1px 2px rgba(30,30,20,.06), 0 8px 24px rgba(30,30,20,.06);
  color-scheme: light;
}
:root[data-cours="finance"] {
  --accent: #1d6a5a; --accent-ink: #fff; --accent-soft: #dcebe5; --hero: #123d33; --hero-ink: #f3efe2;
  --m1: #5a6a73; --m2: #b0383a; --m3: #2d5ca6; --m4: #b85a15; --m5: #2c7a4e; --m6: #8f6b0f; --m7: #6a4396; --m8: #1d6a5a;
}
:root[data-cours="trading"] {
  --accent: #2f54c4; --accent-ink: #fff; --accent-soft: #e0e6fa; --hero: #141c3a; --hero-ink: #eef1fb;
  --m1: #5a6a73; --m2: #2d5ca6; --m3: #6a4396; --m4: #b0383a; --m5: #2c7a4e; --m6: #b85a15; --m7: #8f6b0f; --m8: #1a6a7a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1412; --surface: #161d1a; --ink: #e8ece6; --muted: #9aa69f; --line: #2a3430; --soft: #1d2622;
    --gold: #f2c14e; --gold-soft: #3a3020; --flame: #ff8a55; --up: #6cc79a; --down: #ef8b85;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-cours="finance"] { --accent: #6cc3ac; --accent-ink: #0b1513; --accent-soft: #1b3029; --hero: #0d2a23; --hero-ink: #eef3ea;
    --m1: #a8b6bd; --m2: #ef8b85; --m3: #93b3ec; --m4: #f0a468; --m5: #86cb9f; --m6: #e0bf68; --m7: #bb9ce2; --m8: #6cc3ac; }
  :root:not([data-theme="light"])[data-cours="trading"] { --accent: #93aaf5; --accent-ink: #0c1230; --accent-soft: #1d2440; --hero: #0e1430; --hero-ink: #eef1fb;
    --m1: #a8b6bd; --m2: #93b3ec; --m3: #bb9ce2; --m4: #ef8b85; --m5: #86cb9f; --m6: #f0a468; --m7: #e0bf68; --m8: #7cc8d6; }
}
:root[data-theme="dark"] {
  --paper: #0f1412; --surface: #161d1a; --ink: #e8ece6; --muted: #9aa69f; --line: #2a3430; --soft: #1d2622;
  --gold: #f2c14e; --gold-soft: #3a3020; --flame: #ff8a55; --up: #6cc79a; --down: #ef8b85;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
:root[data-theme="dark"][data-cours="finance"] { --accent: #6cc3ac; --accent-ink: #0b1513; --accent-soft: #1b3029; --hero: #0d2a23; --hero-ink: #eef3ea;
  --m1: #a8b6bd; --m2: #ef8b85; --m3: #93b3ec; --m4: #f0a468; --m5: #86cb9f; --m6: #e0bf68; --m7: #bb9ce2; --m8: #6cc3ac; }
:root[data-theme="dark"][data-cours="trading"] { --accent: #93aaf5; --accent-ink: #0c1230; --accent-soft: #1d2440; --hero: #0e1430; --hero-ink: #eef1fb;
  --m1: #a8b6bd; --m2: #93b3ec; --m3: #bb9ce2; --m4: #ef8b85; --m5: #86cb9f; --m6: #f0a468; --m7: #e0bf68; --m8: #7cc8d6; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--f-body);
  padding: 0 max(16px, env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  transition: background .3s; }
.wrap { max-width: 1040px; margin: 0 auto; }
a { color: var(--accent); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.eyebrow { font: 500 12px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none;
  font: 600 15px/1 var(--f-body); padding: 14px 20px; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap; transition: transform .15s, filter .15s; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: #1d1606; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Barre du haut ---------- */
.top { position: sticky; top: 0; z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.marque { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 400 18px/1 var(--f-display); white-space: nowrap; }
.marque svg { width: 30px; height: 30px; flex: none; }
.switch { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 999px; padding: 4px; margin-inline: auto; }
.switch button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); font: 600 14px/1 var(--f-body); padding: 10px 18px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center; transition: color .25s; }
.switch button[aria-pressed="true"] { color: var(--accent-ink); }
.switch .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--accent); transition: transform .35s cubic-bezier(.3,1.3,.5,1), background .3s; box-shadow: var(--shadow); }
:root[data-cours="trading"] .switch .pill { transform: translateX(100%); }
.switch small { font: 500 11px/1 var(--f-mono); opacity: .8; }
.outils { display: flex; gap: 6px; align-items: center; }
.rond { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.rond svg { width: 18px; height: 18px; }
.flamme-mini { display: inline-flex; align-items: center; gap: 4px; font: 600 14px/1 var(--f-mono); color: var(--flame); padding: 0 10px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.flamme-mini svg { width: 16px; height: 16px; }
@media (max-width: 640px) {
  .marque span { display: none; }
  .switch button { padding: 10px 12px; } .switch small { display: none; }
  .flamme-mini { padding: 0 8px; }
}

/* ---------- Accueil ---------- */
.hero { margin-top: 24px; background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: clamp(24px, 4vw, 44px); position: relative; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: center; transition: background .4s; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .5; }
.hero .eyebrow { color: color-mix(in srgb, var(--hero-ink) 70%, transparent); }
.hero h1 { font: 400 clamp(38px, 7vw, 72px)/0.98 var(--f-display); margin: 12px 0 14px; letter-spacing: -.01em; text-wrap: balance; }
.hero p { margin: 0; max-width: 44ch; font-size: 17px; color: color-mix(in srgb, var(--hero-ink) 82%, transparent); }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.hero .btn.ghost { color: var(--hero-ink); border-color: color-mix(in srgb, var(--hero-ink) 35%, transparent); }
.salut { font: 500 15px/1.3 var(--f-body); color: var(--gold); }
:root:not([data-theme="dark"]) .hero .salut { color: #f2c14e; }
.anneau { justify-self: end; display: grid; place-items: center; position: relative; width: min(220px, 100%); aspect-ratio: 1; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau .fond { stroke: color-mix(in srgb, var(--hero-ink) 18%, transparent); }
.anneau .val { stroke: #f2c14e; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.anneau .centre { position: absolute; text-align: center; }
.anneau .centre b { display: block; font: 400 46px/1 var(--f-display); }
.anneau .centre span { font-size: 13px; opacity: .8; }

.tuiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.tuile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.tuile .eyebrow { font-size: 11px; }
.tuile b { display: block; font: 400 30px/1.1 var(--f-display); margin-top: 6px; }
.tuile small { color: var(--muted); font-size: 13px; }
.tuile.flamme b { color: var(--flame); display: flex; align-items: center; gap: 6px; }
.tuile.flamme b svg { width: 24px; height: 24px; }
.semaine { display: flex; gap: 5px; margin-top: 8px; }
.semaine i { flex: 1; height: 24px; border-radius: 6px; background: var(--soft); font: 500 10px/24px var(--f-mono); text-align: center; color: var(--muted); font-style: normal; }
.semaine i.ok { background: var(--flame); color: #fff; }
.semaine i.auj { outline: 1.5px dashed var(--flame); outline-offset: 1px; }
.barre-xp { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.barre-xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--flame)); border-radius: 99px; transition: width 1s; }
@media (max-width: 860px) { .tuiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .anneau { justify-self: start; width: 150px; position: absolute; right: -18px; top: -18px; opacity: .9; }
  .anneau .centre b { font-size: 30px; }
  .hero h1 { padding-right: 90px; }
}

.defi { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.defi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c, var(--accent)); }
.defi h2 { font: 400 clamp(22px, 3.6vw, 32px)/1.15 var(--f-display); margin: 6px 0 4px; text-wrap: balance; }
.defi .meta { color: var(--muted); font-size: 14px; }
.check { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
.check li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.check li i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.check li.ok { color: var(--ink); }
.check li.ok i { background: var(--up); border-color: var(--up); }
.check li.ok i::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
@media (max-width: 680px) { .defi { grid-template-columns: minmax(0, 1fr); } }

.badges { margin-top: 40px; }
.titre-sec { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.titre-sec h2 { font: 400 28px/1.1 var(--f-display); margin: 0; }
.titre-sec p { margin: 0; color: var(--muted); font-size: 14px; }
.badges .liste { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.badge { flex: 0 0 auto; scroll-snap-align: start; width: 128px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; text-align: center; }
.badge .ico { width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); }
.badge .ico svg { width: 24px; height: 24px; }
.badge b { display: block; font-size: 13px; line-height: 1.25; }
.badge small { color: var(--muted); font-size: 11.5px; line-height: 1.3; display: block; margin-top: 3px; }
.badge.verrou { opacity: .5; }
.badge.verrou .ico { background: var(--soft); color: var(--muted); }

.programme { margin-top: 40px; }
.modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.module { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.module header { padding: 16px 18px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; }
.pastille { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; background: var(--c); color: var(--surface); display: grid; place-items: center; font: 400 22px/1 var(--f-display); }
.module h3 { font: 400 19px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.module .pct { grid-row: span 2; font: 500 13px/1 var(--f-mono); color: var(--c); }
.module .jauge { height: 4px; background: var(--soft); margin: 0 18px; border-radius: 9px; overflow: hidden; }
.module .jauge i { display: block; height: 100%; background: var(--c); }
.module ol { list-style: none; margin: 0; padding: 6px 0 8px; }
.module li a, .module li .row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 18px; color: inherit; text-decoration: none; font-size: 15px; line-height: 1.4; }
.module li a:hover { background: var(--soft); }
.module li .n { color: var(--c); font-weight: 500; }
.module li .row { color: var(--muted); }
.module li .row .n { color: var(--muted); opacity: .7; }
.etat { font: 500 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.etat.dispo { background: var(--c); color: var(--surface); }
.etat.lue { color: var(--up); padding-inline: 0; }
.etat.bientot { color: var(--muted); padding-inline: 0; }
@media (max-width: 760px) { .modules { grid-template-columns: minmax(0, 1fr); } }
.avert { margin-top: 18px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--down); padding: 2px 0 2px 12px; }

/* ---------- Leçon ---------- */
.progression-lecture { position: fixed; top: 0; left: 0; height: 3px; background: var(--c, var(--accent)); z-index: 50; width: 0; transition: width .1s linear; }
.lecon-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.back { color: var(--ink); text-decoration: none; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.lecon-head { padding-block: 24px 20px; max-width: 70ch; margin: 0 auto; }
.lecon-head .eyebrow { color: var(--c); }
.lecon-head h1 { font: 400 clamp(32px, 6vw, 54px)/1.05 var(--f-display); margin: 12px 0; text-wrap: balance; }
.lecon-head .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.stripe { height: 6px; border-radius: 3px; background: var(--c); width: 72px; margin-top: 20px; }
article.cours { max-width: 70ch; margin: 0 auto; font-size: 17.5px; line-height: 1.75; }
article.cours h2 { font: 400 27px/1.2 var(--f-display); margin: 46px 0 12px; text-wrap: balance; }
article.cours h3 { font: 600 18px/1.3 var(--f-body); margin: 28px 0 8px; }
article.cours p, article.cours ul, article.cours ol { margin: 0 0 16px; }
article.cours li { margin-bottom: 6px; }
article.cours strong { font-weight: 600; }
article.cours code { font: 400 .88em var(--f-mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
article.cours pre { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 13px; line-height: 1.5; }
article.cours pre code { background: none; padding: 0; }
article.cours blockquote { margin: 0 0 16px; padding: 14px 18px; border-left: 4px solid var(--c); background: var(--surface); border-radius: 0 12px 12px 0; }
article.cours blockquote p:last-child { margin: 0; }
article.cours .table { overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
article.cours table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
article.cours th { background: var(--soft); font-weight: 600; }
article.cours th, article.cours td { border-bottom: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
article.cours tr:last-child td { border-bottom: 0; }
article.cours h2.retenir { display: flex; align-items: center; gap: 10px; }
article.cours h2.retenir::before { content: "★"; color: var(--gold); font-size: .8em; }
article.cours h2.retenir + ul { background: var(--gold-soft); border-radius: 14px; padding: 18px 18px 18px 38px; }
article.cours details { background: var(--surface); border: 1.5px dashed var(--c); border-radius: 14px; padding: 4px 20px; margin: 24px 0; }
article.cours details[open] { border-style: solid; padding-bottom: 12px; }
article.cours summary { cursor: pointer; font-weight: 600; padding: 12px 0; color: var(--c); }
article.cours hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0 20px; }
.fin-lecon { max-width: 70ch; margin: 40px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); text-align: center; }
.fin-lecon h2 { font: 400 26px/1.2 var(--f-display); margin: 0 0 6px; }
.fin-lecon p { color: var(--muted); margin: 0 0 18px; }
.fin-lecon .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.navs { max-width: 70ch; margin: 18px auto 0; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- Prof IA ---------- */
.flottant { position: fixed; z-index: 30; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 14px 18px 14px 14px; }
.flottant .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; }
.flottant .av svg { width: 16px; height: 16px; }
@media (max-width: 640px) { .flottant { font-size: 0; gap: 0; padding: 12px; } .flottant .av { width: 32px; height: 32px; } }
.voile { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.3); }
.prof { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  box-shadow: -18px 0 40px rgba(0,0,0,.15); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) 0; animation: glisse .25s ease; }
@keyframes glisse { from { transform: translateX(30px); opacity: 0; } }
.prof > header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.prof .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.prof .avatar svg { width: 22px; height: 22px; }

<script type="application/json" id="data-finance">{"debut": "2026-10-14", "modules": [{"n": 1, "titre": "Les fondations", "lecons": [{"n": 1, "titre": "Qu'est-ce que la finance ? Les trois grandes questions (investir, financer, gérer la trésorerie) et le rôle du directeur financier"}, {"n": 2, "titre": "La valeur temps de l'argent : intérêts simples et intérêts composés"}, {"n": 3, "titre": "Actualisation et capitalisation : valeur actuelle, valeur future"}, {"n": 4, "titre": "Taux nominal, taux effectif, inflation et taux réel"}, {"n": 5, "titre": "Les annuités et les rentes : calculer un remboursement d'emprunt"}, {"n": 6, "titre": "Construire un tableau d'amortissement"}]}, {"n": 2, "titre": "Lire les comptes d'une entreprise", "lecons": [{"n": 7, "titre": "Les trois états financiers et comment ils s'emboîtent"}, {"n": 8, "titre": "Le bilan : actif, passif, capitaux propres"}, {"n": 9, "titre": "Le compte de résultat : du chiffre d'affaires au résultat net"}, {"n": 10, "titre": "Les soldes intermédiaires de gestion : marge, valeur ajoutée, EBE / EBITDA"}, {"n": 11, "titre": "Le tableau des flux de trésorerie : pourquoi profit ≠ cash"}, {"n": 12, "titre": "Le bilan fonctionnel : fonds de roulement, BFR et trésorerie nette"}]}, {"n": 3, "titre": "Analyser la performance", "lecons": [{"n": 13, "titre": "Les ratios de rentabilité : ROE, ROA, ROCE"}, {"n": 14, "titre": "La décomposition de DuPont"}, {"n": 15, "titre": "Les ratios de liquidité et de solvabilité"}, {"n": 16, "titre": "Les délais clients, fournisseurs et stocks (cycle de conversion du cash)"}, {"n": 17, "titre": "L'effet de levier financier"}, {"n": 18, "titre": "Étude de cas : analyser une vraie entreprise du CAC 40"}]}, {"n": 4, "titre": "Décider d'investir", "lecons": [{"n": 19, "titre": "Les flux de trésorerie d'un projet d'investissement"}, {"n": 20, "titre": "La VAN (valeur actuelle nette)"}, {"n": 21, "titre": "Le TRI et ses pièges"}, {"n": 22, "titre": "Délai de récupération et indice de profitabilité"}, {"n": 23, "titre": "Étude de cas : faut-il ouvrir une nouvelle usine ?"}]}, {"n": 5, "titre": "Risque et marchés financiers", "lecons": [{"n": 24, "titre": "Les marchés financiers : actions, obligations, qui fait quoi"}, {"n": 25, "titre": "Rendement et risque : espérance, variance, écart-type"}, {"n": 26, "titre": "La diversification et la théorie du portefeuille (Markowitz)"}, {"n": 27, "titre": "Le MEDAF / CAPM et le bêta"}, {"n": 28, "titre": "L'évaluation des obligations : prix, taux, duration"}, {"n": 29, "titre": "L'évaluation des actions : modèle de Gordon-Shapiro et multiples (PER)"}]}, {"n": 6, "titre": "Financer l'entreprise", "lecons": [{"n": 30, "titre": "Dette ou capitaux propres : les sources de financement"}, {"n": 31, "titre": "Le coût du capital : le CMPC / WACC"}, {"n": 32, "titre": "La structure financière : Modigliani-Miller en langage simple"}, {"n": 33, "titre": "La politique de dividendes et les rachats d'actions"}]}, {"n": 7, "titre": "Évaluer une entreprise", "lecons": [{"n": 34, "titre": "La méthode DCF pas à pas (1) : prévoir les free cash flows"}, {"n": 35, "titre": "La méthode DCF pas à pas (2) : valeur terminale et valeur des fonds propres"}, {"n": 36, "titre": "Les comparables boursiers et transactionnels"}, {"n": 37, "titre": "Fusions-acquisitions et LBO : les bases"}]}, {"n": 8, "titre": "Pour aller plus loin", "lecons": [{"n": 38, "titre": "Les produits dérivés : forwards, futures, options"}, {"n": 39, "titre": "La finance de marché et la gestion d'actifs : les métiers"}, {"n": 40, "titre": "Révision générale et grand exercice de synthèse"}]}], "lecons": {"1": {"titre": "Qu'est-ce que la finance ?", "html": "<h2>Pourquoi commencer par là<\/h2>\n<p>Avant de calculer quoi que ce soit, il faut savoir à quelle question on répond. La finance d'entreprise n'est pas une collection de formules : c'est une façon de prendre des décisions avec de l'argent, quand l'avenir est incertain. Toutes les formules que tu verras dans ce cours servent à répondre à trois questions, et seulement trois.<\/p>\n<h2>L'idée centrale : créer de la valeur<\/h2>\n<p>Une entreprise reçoit de l'argent (de ses actionnaires, de ses banques), l'utilise pour acheter des machines, embaucher, produire, vendre, et espère récupérer <em>plus<\/em> d'argent qu'elle n'en a mis. Si elle y arrive, elle <strong>crée de la valeur<\/strong>. Sinon, elle en détruit, même si elle affiche un bénéfice comptable.<\/p>\n<p>Retiens dès maintenant cette nuance, on y reviendra souvent : <strong>un bénéfice n'est pas forcément une création de valeur.<\/strong> Si tes actionnaires auraient pu gagner 8 % en plaçant leur argent ailleurs avec le même risque, et que ton entreprise ne leur rapporte que 5 %, tu as fait un bénéfice mais tu as détruit de la valeur. C'est la notion de <strong>coût d'opportunité<\/strong>, et c'est le cœur de la finance.<\/p>\n<h2>Les trois grandes questions<\/h2>\n<h3>1. Où investir ? (la décision d'investissement)<\/h3>\n<p>Quels projets l'entreprise doit-elle lancer ? Ouvrir une usine, racheter un concurrent, lancer un produit, développer un logiciel... Chaque projet coûte de l'argent aujourd'hui et promet de l'argent demain. La question est : <em>ce que je recevrai demain vaut-il plus que ce que je dépense aujourd'hui ?<\/em><\/p>\n<p>C'est le côté <strong>gauche du bilan<\/strong> (l'actif) : ce que l'entreprise possède et utilise.<\/p>\n<h3>2. Comment financer ? (la décision de financement)<\/h3>\n<p>Une fois qu'on sait quoi faire, il faut trouver l'argent. Deux grandes sources :<\/p>\n<ul><li><strong>Les capitaux propres<\/strong> : l'argent des actionnaires. Ils deviennent propriétaires, ils ne sont pas remboursés à date fixe, mais ils exigent un rendement élevé parce qu'ils prennent le plus de risque (ils sont payés en dernier).<\/li><li><strong>La dette<\/strong> : l'argent des prêteurs (banques, investisseurs obligataires). Elle doit être remboursée avec des intérêts, quoi qu'il arrive, mais elle coûte en général moins cher.<\/li><\/ul>\n<p>C'est le côté <strong>droit du bilan<\/strong> (le passif) : d'où vient l'argent.<\/p>\n<h3>3. Comment gérer le quotidien ? (la gestion de la trésorerie)<\/h3>\n<p>Une entreprise rentable peut faire faillite si elle manque de cash au mauvais moment. Les clients paient à 60 jours, les fournisseurs veulent être payés à 30, les salaires tombent à la fin du mois... Gérer ces décalages, c'est la gestion du <strong>besoin en fonds de roulement<\/strong> et de la <strong>trésorerie<\/strong>. On dit souvent : <em>« le chiffre d'affaires, c'est la vanité ; le profit, c'est la santé ; le cash, c'est la réalité. »<\/em><\/p>\n<h2>Le schéma qui résume tout<\/h2>\n<pre><code>        INVESTISSEURS                    ENTREPRISE                    ACTIFS RÉELS\n  (actionnaires, banques)                                       (usines, stocks, brevets...)\n\n     1. apportent l'argent  ───────►  [ Directeur  ]  ───────►  2. investit dans des actifs\n                                      [ financier  ]\n     5. reçoivent dividendes ◄───────  [            ]  ◄───────  3. les actifs génèrent du cash\n        et intérêts                    4. réinvestit une partie<\/code><\/pre>\n<p>Le directeur financier (le <strong>CFO<\/strong>, <em>Chief Financial Officer<\/em>) se tient au milieu : il récupère l'argent des investisseurs, le place dans les meilleurs projets, et redistribue ce qu'ils rapportent. Son but : que le cash qui revient (flèche 3) vaille plus que le cash qui est parti (flèche 1).<\/p>\n<h2>Qui fait quoi dans la fonction finance<\/h2>\n<ul><li><strong>Le contrôleur de gestion<\/strong> suit les coûts, les budgets, les écarts entre prévu et réalisé.<\/li><li><strong>Le comptable<\/strong> enregistre les opérations et produit les états financiers (bilan, compte de résultat).<\/li><li><strong>Le trésorier<\/strong> gère le cash au jour le jour, les relations avec les banques, les placements à court terme.<\/li><li><strong>Le CFO<\/strong> coordonne tout ça et prend les décisions stratégiques : investissements majeurs, levées de fonds, acquisitions.<\/li><\/ul>\n<p>Hors de l'entreprise, la finance de marché (banques d'investissement, fonds, gestion d'actifs) fait le lien entre ceux qui ont de l'argent et ceux qui en ont besoin. On en parlera au module 5.<\/p>\n<h2>Le principe qui guide toutes les décisions<\/h2>\n<p>L'objectif classique de la finance d'entreprise est de <strong>maximiser la valeur de l'entreprise pour ses actionnaires<\/strong>. Pas le chiffre d'affaires, pas le bénéfice de cette année : la valeur, c'est-à-dire la somme de tout le cash que l'entreprise générera dans le futur, ramenée à aujourd'hui.<\/p>\n<p>Ce « ramené à aujourd'hui » est capital : <strong>1 € aujourd'hui vaut plus que 1 € dans un an.<\/strong> Pourquoi ? Parce qu'avec 1 € aujourd'hui, tu peux le placer et avoir plus d'1 € dans un an. Et parce que l'avenir est incertain. C'est exactement le sujet de la leçon de demain : la valeur temps de l'argent.<\/p>\n<p><em>(Remarque : aujourd'hui, on parle aussi beaucoup des autres parties prenantes, salariés, clients, environnement, à travers la RSE et les critères ESG. Ces sujets ne remplacent pas la logique de création de valeur, ils l'enrichissent.)<\/em><\/p>\n<h2>À retenir<\/h2>\n<ul><li>La finance répond à trois questions : <strong>où investir, comment financer, comment gérer le cash<\/strong>.<\/li><li>Investir = l'actif du bilan ; financer = le passif.<\/li><li>Créer de la valeur, c'est rapporter <strong>plus que le coût d'opportunité<\/strong> de l'argent utilisé, pas juste faire un bénéfice.<\/li><li>Les actionnaires prennent plus de risque que les prêteurs, donc ils exigent un rendement plus élevé.<\/li><li><strong>1 € aujourd'hui vaut plus que 1 € demain.<\/strong><\/li><\/ul>\n<h2>Exercice<\/h2>\n<p>Pour chaque situation, dis s'il s'agit d'une décision d'<strong>investissement<\/strong>, de <strong>financement<\/strong> ou de <strong>gestion de la trésorerie<\/strong> :<\/p>\n<ol><li>Decathlon décide d'ouvrir 15 nouveaux magasins en Inde.<\/li><li>Une start-up lève 3 M€ auprès d'un fonds de capital-risque.<\/li><li>Une PME négocie avec ses clients pour être payée à 30 jours au lieu de 60.<\/li><li>LVMH émet des obligations à 10 ans pour 2 Md€.<\/li><li>Une entreprise rachète un concurrent.<\/li><li>Ton entreprise a 500 000 € sur son compte courant qui dorment et décide de les placer sur un compte à terme de 3 mois.<\/li><\/ol>\n<p><strong>Question bonus<\/strong> : une entreprise réalise un bénéfice de 1 M€ avec 20 M€ de capitaux propres. Ses actionnaires pourraient obtenir 9 % par an ailleurs, avec un risque comparable. A-t-elle créé de la valeur ?<\/p>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li><strong>Investissement<\/strong> : on engage de l'argent aujourd'hui dans des actifs (magasins) pour des cash-flows futurs.<\/li><li><strong>Financement<\/strong> : capitaux propres.<\/li><li><strong>Gestion de la trésorerie<\/strong> : on réduit le décalage entre ventes et encaissements (le BFR).<\/li><li><strong>Financement<\/strong> : dette.<\/li><li><strong>Investissement<\/strong> : un rachat est un gros projet d'investissement.<\/li><li><strong>Gestion de la trésorerie<\/strong> : placement à court terme de l'excédent de cash.<\/li><\/ol>\n<p><strong>Bonus<\/strong> : rentabilité pour les actionnaires = 1 / 20 = <strong>5 %<\/strong>. Ils exigent 9 %. L'entreprise a fait un bénéfice mais <strong>a détruit de la valeur<\/strong> : il aurait fallu un bénéfice d'au moins 20 × 9 % = 1,8 M€ pour simplement satisfaire leurs attentes.<\/p>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : la valeur temps de l'argent, intérêts simples et intérêts composés.<\/em><\/p>", "minutes": 10}, "2": {"titre": "La valeur temps de l'argent", "html": "<h2>Pourquoi c'est la brique de base<\/h2>\n<p>Hier, on a terminé sur une phrase : <strong>1 € aujourd'hui vaut plus que 1 € dans un an.<\/strong> Aujourd'hui, on transforme cette intuition en chiffres. Tout le reste du cours (emprunts, VAN, valorisation d'entreprise, obligations) repose sur ce qu'on voit ce matin. Si cette leçon est claire, la moitié de la finance devient logique.<\/p>\n<h2>Trois raisons pour lesquelles l'argent a une valeur dans le temps<\/h2>\n<ol><li><strong>Le coût d'opportunité<\/strong> : 1 € disponible aujourd'hui peut être placé et rapporter des intérêts. Attendre, c'est renoncer à ce gain.<\/li><li><strong>L'inflation<\/strong> : avec le temps, les prix montent, donc 1 € achète moins de choses demain qu'aujourd'hui.<\/li><li><strong>Le risque<\/strong> : une promesse de paiement futur peut ne jamais être tenue. Un euro certain dans la poche vaut plus qu'un euro promis.<\/li><\/ol>\n<p>Le <strong>taux d'intérêt<\/strong> est le prix de l'attente. C'est ce qu'il faut te donner pour que tu acceptes de te séparer de ton argent pendant un certain temps.<\/p>\n<h2>Les intérêts simples<\/h2>\n<p>Avec des intérêts simples, les intérêts sont calculés <strong>uniquement sur le capital de départ<\/strong>, chaque année la même somme.<\/p>\n<blockquote><p><strong>Valeur finale = Capital × (1 + taux × nombre d'années)<\/strong><\/p>\n<p><code>VF = C × (1 + i × n)<\/code><\/p><\/blockquote>\n<p><strong>Exemple<\/strong> : tu places 1 000 € à 5 % par an en intérêts simples pendant 3 ans. Chaque année tu gagnes 1 000 × 5 % = 50 €. Au bout de 3 ans : 1 000 × (1 + 0,05 × 3) = <strong>1 150 €<\/strong>.<\/p>\n<p>Les intérêts simples s'utilisent surtout pour des durées courtes (moins d'un an) : placements de trésorerie à quelques mois, escompte d'effets de commerce, découverts bancaires.<\/p>\n<h2>Les intérêts composés<\/h2>\n<p>Avec des intérêts composés, les intérêts de chaque année <strong>s'ajoutent au capital<\/strong> et produisent à leur tour des intérêts. On dit que les intérêts sont <strong>capitalisés<\/strong>. C'est des intérêts sur les intérêts.<\/p>\n<blockquote><p><strong>Valeur finale = Capital × (1 + taux) ^ nombre d'années<\/strong><\/p>\n<p><code>VF = C × (1 + i)^n<\/code><\/p><\/blockquote>\n<p><strong>Même exemple<\/strong> : 1 000 € à 5 % pendant 3 ans, en intérêts composés.<\/p>\n<table><thead><tr><th>Année<\/th><th>Capital en début d'année<\/th><th>Intérêts de l'année<\/th><th>Capital en fin d'année<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1 000,00 €<\/td><td>50,00 €<\/td><td>1 050,00 €<\/td><\/tr><tr><td>2<\/td><td>1 050,00 €<\/td><td>52,50 €<\/td><td>1 102,50 €<\/td><\/tr><tr><td>3<\/td><td>1 102,50 €<\/td><td>55,13 €<\/td><td>1 157,63 €<\/td><\/tr><\/tbody><\/table>\n<p>Regarde la colonne des intérêts : elle <strong>grossit chaque année<\/strong>. En année 2, tu touches 50 € sur ton capital de départ, plus 2,50 € d'intérêts sur les 50 € d'intérêts de l'année 1. Vérifie avec la formule : 1 000 × 1,05³ = <strong>1 157,63 €<\/strong>.<\/p>\n<p>Sur 3 ans, la différence avec les intérêts simples est minuscule (7,63 €). Mais attends de voir ce qui se passe sur longue durée.<\/p>\n<h2>La magie (mathématique) du temps<\/h2>\n<p>Toujours 1 000 € à 5 % :<\/p>\n<table><thead><tr><th>Durée<\/th><th>Intérêts simples<\/th><th>Intérêts composés<\/th><th>Écart<\/th><\/tr><\/thead><tbody><tr><td>3 ans<\/td><td>1 150 €<\/td><td>1 158 €<\/td><td>+ 8 €<\/td><\/tr><tr><td>10 ans<\/td><td>1 500 €<\/td><td>1 629 €<\/td><td>+ 129 €<\/td><\/tr><tr><td>30 ans<\/td><td>2 500 €<\/td><td>4 322 €<\/td><td>+ 1 822 €<\/td><\/tr><\/tbody><\/table>\n<p>Avec les intérêts simples, la croissance est <strong>linéaire<\/strong> (une droite). Avec les intérêts composés, elle est <strong>exponentielle<\/strong> (une courbe qui s'envole). Plus la durée est longue, plus l'écart explose.<\/p>\n<p><strong>L'histoire qu'on raconte toujours en cours<\/strong> : en 1626, les colons néerlandais auraient acheté l'île de Manhattan pour l'équivalent de 24 dollars. Mauvaise affaire pour les vendeurs ? Si ces 24 $ avaient été placés à 7 % par an pendant 400 ans, ils vaudraient aujourd'hui plus de <strong>13 000 milliards de dollars<\/strong>. Les intérêts composés sur une très longue durée produisent des chiffres vertigineux.<\/p>\n<p><strong>Une version plus proche de toi<\/strong> : Léa place 2 000 € une seule fois à 20 ans, à 7 % par an. Tom place la même somme au même taux, mais à 30 ans. À 60 ans :<\/p>\n<ul><li>Léa a 2 000 × 1,07⁴⁰ ≈ <strong>29 950 €<\/strong><\/li><li>Tom a 2 000 × 1,07³⁰ ≈ <strong>15 225 €<\/strong><\/li><\/ul>\n<p>Dix ans d'avance ont presque <strong>doublé<\/strong> le résultat, avec exactement le même effort. En finance, le temps est ton meilleur allié.<\/p>\n<h2>La règle de 72 : le calcul de tête<\/h2>\n<p>Pour savoir en combien d'années un placement <strong>double<\/strong>, divise 72 par le taux (en %) :<\/p>\n<blockquote><p><strong>Années pour doubler ≈ 72 / taux<\/strong><\/p><\/blockquote>\n<ul><li>À 5 % : 72 / 5 ≈ 14,4 ans (calcul exact : 14,2 ans)<\/li><li>À 6 % : 72 / 6 = 12 ans (vérifie : 1,06¹² = 2,01)<\/li><li>À 8 % : 72 / 8 = 9 ans<\/li><\/ul>\n<p>Ça marche aussi dans l'autre sens : avec 3 % d'inflation par an, les prix doublent en 72 / 3 = <strong>24 ans<\/strong>. Ton pouvoir d'achat est divisé par deux en une génération.<\/p>\n<p>C'est un outil précieux en entretien ou en réunion, quand on n'a pas de calculatrice.<\/p>\n<h2>Le vocabulaire à maîtriser<\/h2>\n<ul><li><strong>Capital (C)<\/strong> : la somme placée au départ. On l'appelle aussi valeur actuelle (VA, ou <em>PV<\/em> pour <em>present value<\/em>).<\/li><li><strong>Valeur future / valeur acquise (VF, ou <em>FV<\/em>)<\/strong> : ce que vaut le capital à la fin du placement.<\/li><li><strong>Taux d'intérêt (i)<\/strong> : toujours exprimé <strong>par période<\/strong> (par an en général). Attention : un taux annuel s'utilise avec un nombre d'années, un taux mensuel avec un nombre de mois.<\/li><li><strong>Capitalisation<\/strong> : le fait de calculer une valeur future en faisant « grossir » un montant vers l'avenir. C'est exactement ce que fait la formule <code>C × (1 + i)^n<\/code>.<\/li><\/ul>\n<p>Demain, on fera le chemin <strong>inverse<\/strong> : partir d'une somme future et chercher ce qu'elle vaut aujourd'hui. C'est l'<strong>actualisation<\/strong>, et c'est l'outil le plus utilisé de toute la finance.<\/p>\n<h2>À retenir<\/h2>\n<ul><li>Le taux d'intérêt est le <strong>prix du temps<\/strong> : il rémunère le coût d'opportunité, l'inflation et le risque.<\/li><li><strong>Intérêts simples<\/strong> : <code>VF = C × (1 + i × n)<\/code>, les intérêts portent seulement sur le capital de départ. Utilisés pour le court terme.<\/li><li><strong>Intérêts composés<\/strong> : <code>VF = C × (1 + i)^n<\/code>, les intérêts produisent eux-mêmes des intérêts. C'est la règle par défaut en finance.<\/li><li>Sur longue durée, l'écart entre les deux devient énorme : la croissance composée est <strong>exponentielle<\/strong>.<\/li><li><strong>Règle de 72<\/strong> : un placement double en environ 72 / taux années.<\/li><li>Commencer tôt compte souvent plus que placer beaucoup.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Tu places 5 000 € à 3 % par an pendant 4 ans en <strong>intérêts simples<\/strong>. Combien as-tu à la fin ?<\/li><li>Même placement, mais en <strong>intérêts composés<\/strong>. Combien as-tu à la fin ?<\/li><li>Avec la règle de 72, en combien de temps une somme placée à 6 % double-t-elle ?<\/li><li>Ta banque te propose deux placements de 10 000 € sur 10 ans. <strong>A<\/strong> : 4 % par an en intérêts simples. <strong>B<\/strong> : 3,5 % par an en intérêts composés. Lequel choisis-tu ?<\/li><li><strong>Question de réflexion<\/strong> : une start-up te dit que son chiffre d'affaires « croît de 10 % par an ». Pourquoi est-ce une croissance composée et pas simple ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li>5 000 × (1 + 0,03 × 4) = 5 000 × 1,12 = <strong>5 600 €<\/strong>.<\/li><li>5 000 × 1,03⁴ = 5 000 × 1,1255 = <strong>5 627,54 €<\/strong>. Soit 27,54 € de plus grâce aux intérêts sur les intérêts.<\/li><li>72 / 6 = <strong>12 ans<\/strong>. Vérification : 1,06¹² = 2,012, donc la somme a bien (un peu plus que) doublé.<\/li><li>A : 10 000 × (1 + 0,04 × 10) = <strong>14 000 €<\/strong>. B : 10 000 × 1,035¹⁰ = <strong>14 105,99 €<\/strong>. <strong>B est meilleur<\/strong>, alors que son taux est plus bas ! Sur 10 ans, la capitalisation compense largement le demi-point de taux en moins. Morale : on ne compare jamais deux taux sans savoir comment ils sont calculés.<\/li><li>Parce que les 10 % s'appliquent chaque année au chiffre d'affaires <strong>de l'année précédente<\/strong>, qui a déjà grossi. Un CA de 1 M€ passe à 1,1 M€, puis 1,21 M€, puis 1,331 M€... C'est la formule <code>(1 + i)^n<\/code>. Avec la règle de 72, le CA double en un peu plus de 7 ans.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : actualisation et capitalisation, ou comment calculer ce que vaut aujourd'hui une somme que tu recevras dans le futur.<\/em><\/p>", "minutes": 13}, "3": {"titre": "Actualiser et capitaliser", "html": "<h2>Le chemin retour<\/h2>\n<p>Hier, tu as appris à faire <strong>grossir<\/strong> une somme dans le temps : 1 000 € placés à 5 % deviennent 1 157,63 € dans 3 ans. C'est la <strong>capitalisation<\/strong> : on part d'aujourd'hui et on regarde vers l'avenir.<\/p>\n<p>Aujourd'hui, on fait le chemin inverse. On te promet une somme dans le futur : combien vaut-elle <strong>aujourd'hui<\/strong> ? C'est l'<strong>actualisation<\/strong>. Et c'est sans doute l'outil le plus utilisé de toute la finance : évaluer un projet, une entreprise, une obligation, un contrat de joueur de foot... tout passe par là.<\/p>\n<h2>Capitalisation et actualisation : deux faces d'une même formule<\/h2>\n<p>On repart de la formule d'hier :<\/p>\n<blockquote><p><strong>Capitalisation<\/strong> : <code>VF = VA × (1 + i)^n<\/code><\/p><\/blockquote>\n<p>Il suffit de la retourner :<\/p>\n<blockquote><p><strong>Actualisation<\/strong> : <code>VA = VF / (1 + i)^n<\/code><\/p><\/blockquote>\n<ul><li><strong>VA<\/strong> (valeur actuelle, ou <em>present value<\/em>) : ce que vaut la somme aujourd'hui.<\/li><li><strong>VF<\/strong> (valeur future, ou <em>future value<\/em>) : la somme reçue dans le futur.<\/li><li><strong>i<\/strong> : le taux d'actualisation, par période.<\/li><li><strong>n<\/strong> : le nombre de périodes.<\/li><\/ul>\n<pre><code>   AUJOURD'HUI                                    DANS n ANS\n\n      VA   ──────── capitaliser : × (1 + i)^n ───────►   VF\n      VA   ◄─────── actualiser  : ÷ (1 + i)^n ────────   VF<\/code><\/pre>\n<p>Le nombre <code>1 / (1 + i)^n<\/code> s'appelle le <strong>facteur d'actualisation<\/strong>. Il est toujours inférieur à 1 (dès que le taux est positif) : une somme future vaut toujours <strong>moins<\/strong> aujourd'hui.<\/p>\n<h2>Premier exemple<\/h2>\n<p>Ta grand-mère te promet 10 000 € pour tes 25 ans, dans 5 ans. Tu pourrais placer ton argent à 4 % par an sans risque. Combien vaut sa promesse aujourd'hui ?<\/p>\n<p>VA = 10 000 / 1,04⁵ = 10 000 × 0,8219 = <strong>8 219,27 €<\/strong><\/p>\n<p>Interprétation : si tu plaçais 8 219,27 € aujourd'hui à 4 %, tu aurais exactement 10 000 € dans 5 ans. Les deux sont donc <strong>équivalents<\/strong>. Recevoir 10 000 € dans 5 ans ou 8 219,27 € aujourd'hui, c'est la même chose (à risque égal).<\/p>\n<h2>Le taux d'actualisation change tout<\/h2>\n<p>Quel taux utiliser ? C'est <strong>le rendement que tu pourrais obtenir ailleurs avec le même niveau de risque<\/strong>. Autrement dit, le coût d'opportunité vu en leçon 1. Plus un flux futur est risqué, plus on l'actualise avec un taux élevé, et moins il vaut aujourd'hui.<\/p>\n<p>Les mêmes 10 000 € dans 5 ans, actualisés à différents taux :<\/p>\n<table><thead><tr><th>Taux d'actualisation<\/th><th>Valeur actuelle<\/th><th>Situation typique<\/th><\/tr><\/thead><tbody><tr><td>2 %<\/td><td>9 057 €<\/td><td>Placement quasi sans risque<\/td><\/tr><tr><td>5 %<\/td><td>7 835 €<\/td><td>Grande entreprise solide<\/td><\/tr><tr><td>10 %<\/td><td>6 209 €<\/td><td>Projet risqué, start-up établie<\/td><\/tr><\/tbody><\/table>\n<p>Avec un taux de 10 %, la promesse perd près de 40 % de sa valeur. C'est pour ça que les investisseurs en capital-risque, qui exigent des rendements très élevés, valorisent si durement les profits lointains d'une start-up.<\/p>\n<p><strong>Retiens la relation inverse<\/strong> : quand le taux monte, la valeur actuelle baisse. Tu verras au module 5 que c'est exactement pour cette raison que le prix des obligations chute quand les banques centrales remontent leurs taux, comme en 2022-2023.<\/p>\n<h2>Comparer des sommes reçues à des dates différentes<\/h2>\n<p>Règle d'or de la finance : <strong>on ne compare jamais des euros de dates différentes<\/strong>. On les ramène d'abord à la même date, en général aujourd'hui.<\/p>\n<p><strong>Exemple<\/strong> : tu gagnes à un jeu. Option A : 50 000 € tout de suite. Option B : 60 000 € dans 4 ans. Ton taux d'opportunité est de 5 %.<\/p>\n<p>VA de B = 60 000 / 1,05⁴ = <strong>49 362 €<\/strong><\/p>\n<p>49 362 € &lt; 50 000 € : <strong>tu prends A<\/strong>, même si 60 000 paraît plus gros. Avec un taux plus bas (disons 3 %), la réponse s'inverserait. Le bon choix dépend toujours du taux.<\/p>\n<h2>Actualiser plusieurs flux<\/h2>\n<p>Dans la vraie vie, on reçoit souvent de l'argent en plusieurs fois. La méthode est simple : <strong>on actualise chaque flux séparément, puis on additionne<\/strong>.<\/p>\n<p><strong>Exemple<\/strong> : un club de foot vend un joueur 30 M€, payables en trois versements de 10 M€ à la fin de chaque année. Le club se finance à 8 %. Combien vaut vraiment la vente aujourd'hui ?<\/p>\n<table><thead><tr><th>Versement<\/th><th>Montant<\/th><th>Calcul<\/th><th>Valeur actuelle<\/th><\/tr><\/thead><tbody><tr><td>Fin d'année 1<\/td><td>10 M€<\/td><td>10 / 1,08<\/td><td>9,26 M€<\/td><\/tr><tr><td>Fin d'année 2<\/td><td>10 M€<\/td><td>10 / 1,08²<\/td><td>8,57 M€<\/td><\/tr><tr><td>Fin d'année 3<\/td><td>10 M€<\/td><td>10 / 1,08³<\/td><td>7,94 M€<\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td><strong>30 M€<\/strong><\/td><td><\/td><td><strong>25,77 M€<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>Le transfert « à 30 M€ » ne vaut en réalité que <strong>25,8 M€<\/strong> aujourd'hui. C'est pour ça que les clubs négocient âprement les échéanciers : payer plus tard, c'est payer moins cher. Cette technique (additionner des flux actualisés) est la base de la <strong>VAN<\/strong> que tu verras au module 4 et de l'évaluation d'entreprise au module 7.<\/p>\n<h2>Retrouver un taux ou une durée<\/h2>\n<p>La formule a quatre variables (VA, VF, i, n). Si tu en connais trois, tu trouves la quatrième.<\/p>\n<p><strong>Trouver le taux<\/strong> : <code>i = (VF / VA)^(1/n) − 1<\/code><\/p>\n<p>Exemple : un appartement acheté 200 000 € est revendu 260 000 € six ans plus tard. Quel rendement annuel ? i = (260 000 / 200 000)^(1/6) − 1 = 1,3^(1/6) − 1 = <strong>4,47 % par an<\/strong>. Ça paraît moins spectaculaire que « + 30 % », et c'est normal : le gain est étalé sur six ans. Toujours ramener une performance à un <strong>taux annuel<\/strong> pour pouvoir la comparer.<\/p>\n<p><strong>Trouver la durée<\/strong> : la règle de 72 d'hier donne un ordre de grandeur rapide. Pour un calcul exact, on utilise les logarithmes : <code>n = ln(VF / VA) / ln(1 + i)<\/code>.<\/p>\n<h2>Sur Excel<\/h2>\n<p>En entreprise, personne ne fait ces calculs à la main. Dans Excel en français :<\/p>\n<ul><li><code>=VA(4%;5;0;-10000)<\/code> donne <strong>8 219,27<\/strong> (la valeur actuelle)<\/li><li><code>=VC(4%;5;0;-8219,27)<\/code> donne <strong>10 000<\/strong> (la valeur future, « valeur capitalisée »)<\/li><li><code>=TAUX(6;0;-200000;260000)<\/code> donne <strong>4,47 %<\/strong><\/li><\/ul>\n<p>Le signe moins est une convention d'Excel : l'argent qui sort de ta poche est négatif, celui qui rentre est positif. Si tu obtiens un résultat négatif, c'est presque toujours une question de signe.<\/p>\n<h2>À retenir<\/h2>\n<ul><li><strong>Capitaliser<\/strong> : <code>VF = VA × (1 + i)^n<\/code>. <strong>Actualiser<\/strong> : <code>VA = VF / (1 + i)^n<\/code>. C'est la même formule dans les deux sens.<\/li><li>Une somme future vaut toujours <strong>moins<\/strong> aujourd'hui (le facteur d'actualisation est inférieur à 1).<\/li><li>Le <strong>taux d'actualisation<\/strong> reflète le coût d'opportunité et le risque. <strong>Taux plus élevé = valeur actuelle plus faible.<\/strong><\/li><li>On ne compare jamais des euros de dates différentes : on les ramène tous à aujourd'hui.<\/li><li>Pour plusieurs flux : on actualise <strong>chacun<\/strong> puis on additionne.<\/li><li>Une performance se compare toujours en <strong>taux annuel<\/strong> : <code>i = (VF / VA)^(1/n) − 1<\/code>.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Quelle est la valeur actuelle de 15 000 € reçus dans 3 ans, avec un taux de 5 % ?<\/li><li>Quelle est la valeur future de 8 000 € placés 6 ans à 3 % ?<\/li><li>Ton futur employeur te propose une prime : 20 000 € à l'embauche, ou 23 000 € dans 3 ans si tu restes. Que choisis-tu avec un taux de 4 % ? Et avec un taux de 6 % ?<\/li><li>Tu as placé 5 000 € et tu récupères 6 500 € au bout de 5 ans. Quel a été ton rendement annuel ?<\/li><li>Quelle est la valeur actuelle de trois versements de 2 000 € reçus à la fin de chacune des trois prochaines années, au taux de 10 % ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li>15 000 / 1,05³ = 15 000 / 1,157625 = <strong>12 957,56 €<\/strong>.<\/li><li>8 000 × 1,03⁶ = 8 000 × 1,1941 = <strong>9 552,42 €<\/strong>.<\/li><li>À 4 % : 23 000 / 1,04³ = <strong>20 446,92 €<\/strong> &gt; 20 000 €, donc tu prends <strong>la prime dans 3 ans<\/strong>. À 6 % : 23 000 / 1,06³ = <strong>19 311,24 €<\/strong> &lt; 20 000 €, donc tu prends <strong>la prime tout de suite<\/strong>. Même offre, décision inverse : tout dépend du taux. (Et en vrai, la prime future est aussi plus risquée, puisqu'il faut rester trois ans : un argument de plus pour un taux élevé.)<\/li><li>i = (6 500 / 5 000)^(1/5) − 1 = 1,3^0,2 − 1 = <strong>5,39 % par an<\/strong>.<\/li><li>2 000 / 1,1 + 2 000 / 1,1² + 2 000 / 1,1³ = 1 818,18 + 1 652,89 + 1 502,63 = <strong>4 973,70 €<\/strong>. Les 6 000 € promis ne valent pas tout à fait 5 000 € aujourd'hui.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : taux nominal, taux effectif, inflation et taux réel. Pourquoi un « 3 % » n'est pas toujours un 3 %.<\/em><\/p>", "minutes": 14}, "4": {"titre": "Nominal, effectif, réel : lire un taux", "html": "<h2>Un « 3 % » n'est pas toujours un 3 %<\/h2>\n<p>Depuis deux jours, on manipule des taux comme si c'était simple : « 5 % par an ». Dans la vraie vie, un taux cache souvent deux pièges.<\/p>\n<ol><li><strong>Le rythme des intérêts<\/strong> : des intérêts versés chaque mois ne rapportent pas la même chose que des intérêts versés une fois par an, même avec le même taux affiché.<\/li><li><strong>L'inflation<\/strong> : gagner 3 % quand les prix montent de 5 %, c'est s'appauvrir.<\/li><\/ol>\n<p>Aujourd'hui, tu apprends à voir à travers ces deux pièges. C'est ce qui sépare quelqu'un qui lit une offre de crédit de quelqu'un qui la comprend.<\/p>\n<h2>Premier piège : le rythme de capitalisation<\/h2>\n<h3>Taux nominal et taux effectif<\/h3>\n<p>Une banque t'annonce un <strong>taux nominal<\/strong> de 12 % par an, avec des intérêts calculés <strong>chaque mois<\/strong>. Concrètement, elle applique 12 % / 12 = <strong>1 % par mois<\/strong>.<\/p>\n<p>Mais rappelle-toi la leçon 2 : chaque mois, les intérêts s'ajoutent au capital et produisent à leur tour des intérêts. Sur un an, 1 000 € deviennent :<\/p>\n<p>1 000 × 1,01¹² = <strong>1 126,83 €<\/strong><\/p>\n<p>Soit <strong>12,68 %<\/strong> sur l'année, et pas 12 %. Ce 12,68 % est le <strong>taux effectif<\/strong> (ou taux actuariel) : ce que tu gagnes ou paies réellement sur un an.<\/p>\n<blockquote><p><strong>Taux effectif annuel = (1 + taux nominal / m)^m − 1<\/strong><\/p>\n<p>où <code>m<\/code> est le nombre de capitalisations par an (12 pour mensuel, 4 pour trimestriel, 365 pour quotidien).<\/p><\/blockquote>\n<ul><li>Le <strong>taux nominal<\/strong> est un taux « d'affichage ». Il ne permet pas de comparer deux offres qui n'ont pas le même rythme.<\/li><li>Le <strong>taux effectif<\/strong> est la vraie mesure. <strong>C'est toujours lui qu'on compare.<\/strong><\/li><\/ul>\n<p>Plus la capitalisation est fréquente, plus l'écart grandit. À 4 % nominal : trimestriel donne 4,06 %, quotidien donne 4,08 %. L'écart est faible à taux bas, beaucoup plus visible à taux élevé.<\/p>\n<h3>Taux proportionnel et taux équivalent<\/h3>\n<p>Le problème inverse : tu connais un taux <strong>annuel<\/strong> et tu as besoin d'un taux <strong>mensuel<\/strong> (pour un tableau de remboursement, par exemple).<\/p>\n<ul><li><strong>Taux proportionnel<\/strong> : on divise simplement. 6 % par an donne 6 / 12 = <strong>0,5 % par mois<\/strong>. Simple, mais sur un an ça redonne plus de 6 %.<\/li><li><strong>Taux équivalent<\/strong> : le taux mensuel qui, composé 12 fois, redonne exactement 6 %. <code>(1,06)^(1/12) − 1<\/code> = <strong>0,487 % par mois<\/strong>.<\/li><\/ul>\n<blockquote><p><strong>Taux équivalent = (1 + taux annuel)^(1/m) − 1<\/strong><\/p><\/blockquote>\n<p>En France, les banques utilisent souvent le taux proportionnel pour les crédits immobiliers, ce qui rend le taux effectif légèrement supérieur au taux affiché. Ce n'est pas une arnaque, c'est une convention, mais il faut la connaître.<\/p>\n<h3>Le TAEG : la loi impose le taux effectif<\/h3>\n<p>Pour protéger les emprunteurs, la loi française (comme le droit européen) oblige les prêteurs à afficher le <strong>TAEG<\/strong>, le <em>taux annuel effectif global<\/em>. Il inclut non seulement les intérêts, mais aussi <strong>tous les frais obligatoires<\/strong> : frais de dossier, assurance exigée, frais de garantie.<\/p>\n<p>Exemple typique : un crédit auto affiché « 4,5 % » peut avoir un TAEG de 5,3 % une fois les frais de dossier et l'assurance intégrés. <strong>Pour comparer deux crédits, on compare les TAEG, jamais les taux nominaux.<\/strong><\/p>\n<p><strong>Le cas des crédits renouvelables<\/strong> : certaines cartes de magasin ou crédits « revolving » affichent un taux mensuel. 1,5 % par mois paraît peu. En taux effectif : 1,015¹² − 1 = <strong>19,56 % par an<\/strong>. C'est pour ça que ces crédits sont si dangereux.<\/p>\n<h2>Deuxième piège : l'inflation<\/h2>\n<h3>Taux nominal et taux réel<\/h3>\n<p>Ici, le mot « nominal » a un autre sens (c'est un piège de vocabulaire classique en partiel) :<\/p>\n<ul><li>Le <strong>taux nominal<\/strong> est le taux exprimé en euros courants, celui que tu vois sur ton relevé.<\/li><li>Le <strong>taux réel<\/strong> est ce que tu gagnes en <strong>pouvoir d'achat<\/strong>, une fois l'inflation retirée.<\/li><\/ul>\n<p>La relation exacte s'appelle l'<strong>équation de Fisher<\/strong> (du nom de l'économiste Irving Fisher) :<\/p>\n<blockquote><p><strong>(1 + taux nominal) = (1 + taux réel) × (1 + inflation)<\/strong><\/p>\n<p>donc <code>taux réel = (1 + taux nominal) / (1 + inflation) − 1<\/code><\/p><\/blockquote>\n<p>Et l'approximation, valable quand les taux sont faibles :<\/p>\n<blockquote><p><strong>Taux réel ≈ taux nominal − inflation<\/strong><\/p><\/blockquote>\n<p><strong>Exemple<\/strong> : ton livret rapporte 3 % et l'inflation est de 2 %. Exact : 1,03 / 1,02 − 1 = <strong>0,98 %<\/strong>. Approximation : 3 − 2 = 1 %. Ton pouvoir d'achat a augmenté d'environ 1 %.<\/p>\n<h3>Ce qui s'est passé en 2022<\/h3>\n<p>En 2022, l'inflation en France a dépassé 5 % sur l'année, alors que le Livret A rapportait entre 0,5 % et 2 %. Les épargnants ont vu leur solde augmenter en euros, mais leur <strong>taux réel se situait entre − 3 % et − 4,5 % environ<\/strong> : ils pouvaient acheter moins de choses avec leur épargne qu'un an plus tôt. Gagner de l'argent en euros ne veut pas dire s'enrichir.<\/p>\n<p>C'est la même logique pour les salaires. Une augmentation de 3 % avec une inflation de 5 %, c'est une <strong>baisse<\/strong> de pouvoir d'achat : 1,03 / 1,05 − 1 = <strong>− 1,9 %<\/strong>. Quand tu négocieras ton premier salaire puis tes augmentations, pense toujours en réel.<\/p>\n<h3>Inflation et actualisation<\/h3>\n<p>Dernier point, important pour la suite du cours : quand on actualise des flux futurs (leçon 3), il faut être <strong>cohérent<\/strong>.<\/p>\n<ul><li>Flux en euros courants (qui incluent l'inflation) → on actualise avec un <strong>taux nominal<\/strong>.<\/li><li>Flux en euros constants (sans inflation) → on actualise avec un <strong>taux réel<\/strong>.<\/li><\/ul>\n<p>Mélanger les deux est une des erreurs les plus fréquentes dans les études de cas. On y reviendra au module 4 avec la VAN.<\/p>\n<h2>À retenir<\/h2>\n<ul><li>Deux taux avec des rythmes de capitalisation différents ne se comparent pas directement : on les convertit en <strong>taux effectif annuel<\/strong>, <code>(1 + i/m)^m − 1<\/code>.<\/li><li><strong>Taux proportionnel<\/strong> = taux annuel / m. <strong>Taux équivalent<\/strong> = <code>(1 + taux annuel)^(1/m) − 1<\/code>.<\/li><li>Pour comparer des crédits, on compare les <strong>TAEG<\/strong>, qui incluent intérêts et frais obligatoires.<\/li><li><strong>Taux réel ≈ taux nominal − inflation<\/strong> (exactement : <code>(1 + nominal) / (1 + inflation) − 1<\/code>).<\/li><li>Un placement ou une augmentation de salaire se juge <strong>en réel<\/strong>.<\/li><li>On actualise des flux nominaux avec un taux nominal, et des flux réels avec un taux réel.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Banque A : 6 % nominal, intérêts capitalisés chaque mois. Banque B : 6,15 % par an, capitalisés une fois par an. Où places-tu ton argent ?<\/li><li>Quel est le taux mensuel <strong>équivalent<\/strong> à un taux annuel de 5 % ?<\/li><li>Un placement rapporte 4 % par an, l'inflation est de 2,5 %. Quel est le taux réel (calcul exact et approximation) ?<\/li><li>Ton salaire passe de 30 000 € à 31 000 € brut par an. L'inflation est de 4 %. As-tu gagné en pouvoir d'achat ?<\/li><li><strong>Question de réflexion<\/strong> : pourquoi une banque qui <em>prête<\/em> préfère-t-elle afficher un taux nominal mensuel, et une banque qui <em>rémunère ton épargne<\/em> préfère-t-elle afficher un taux effectif ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li>Taux effectif de A : 1,005¹² − 1 = <strong>6,17 %<\/strong>. B : <strong>6,15 %<\/strong>. <strong>A est (légèrement) meilleur<\/strong>, alors que son taux affiché est plus bas. Toujours comparer les taux effectifs.<\/li><li>1,05^(1/12) − 1 = <strong>0,407 % par mois<\/strong> (et non 5 / 12 = 0,417 %).<\/li><li>Exact : 1,04 / 1,025 − 1 = <strong>1,46 %<\/strong>. Approximation : 4 − 2,5 = <strong>1,5 %<\/strong>. Très proche, car les taux sont faibles.<\/li><li>Augmentation nominale : 31 000 / 30 000 − 1 = 3,33 %. Taux réel : 1,0333 / 1,04 − 1 = <strong>− 0,64 %<\/strong>. <strong>Non<\/strong> : malgré 1 000 € de plus sur la fiche de paie, ton pouvoir d'achat a légèrement baissé.<\/li><li>Parce que chacun affiche le chiffre qui l'arrange. Pour un prêt, le taux nominal est <strong>plus bas<\/strong> que le taux effectif : le crédit paraît moins cher. Pour une épargne, le taux effectif est <strong>plus haut<\/strong> que le nominal : le placement paraît plus rémunérateur. C'est exactement pour ça que la loi impose le TAEG pour les crédits.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : les annuités et les rentes, ou comment calculer la mensualité d'un emprunt.<\/em><\/p>", "minutes": 13}}}</script>
<script type="application/json" id="data-trading">{"debut": "2026-10-15", "modules": [{"n": 1, "titre": "Les fondations", "lecons": [{"n": 1, "titre": "Qu'est-ce que le trading ? Trader, investir, spéculer : les styles (scalping, day trading, swing, position)"}, {"n": 2, "titre": "Les marchés : actions, indices, forex, matières premières, cryptos, et leurs horaires"}, {"n": 3, "titre": "Comment se forme un prix : carnet d'ordres, bid/ask, spread et liquidité"}, {"n": 4, "titre": "Les types d'ordres : marché, limite, stop, stop-limite"}, {"n": 5, "titre": "Courtiers, frais et fiscalité : CTO, PEA, flat tax"}, {"n": 6, "titre": "Acheter, vendre à découvert, effet de levier et marge"}]}, {"n": 2, "titre": "Lire un graphique", "lecons": [{"n": 7, "titre": "Les bougies japonaises"}, {"n": 8, "titre": "Les unités de temps et l'analyse multi-timeframe"}, {"n": 9, "titre": "La tendance : sommets et creux"}, {"n": 10, "titre": "Supports et résistances"}, {"n": 11, "titre": "Lignes de tendance et canaux"}, {"n": 12, "titre": "Le volume : ce qu'il confirme et ce qu'il dément"}]}, {"n": 3, "titre": "Les indicateurs techniques", "lecons": [{"n": 13, "titre": "Les moyennes mobiles (simple, exponentielle, croisements)"}, {"n": 14, "titre": "Le RSI et la notion de surachat / survente"}, {"n": 15, "titre": "Le MACD"}, {"n": 16, "titre": "La volatilité : bandes de Bollinger et ATR"}, {"n": 17, "titre": "Les figures chartistes : tête-épaules, doubles sommets, triangles"}, {"n": 18, "titre": "Retracements de Fibonacci et les pièges des indicateurs"}]}, {"n": 4, "titre": "Gérer le risque", "lecons": [{"n": 19, "titre": "Pourquoi la plupart des traders perdent de l'argent"}, {"n": 20, "titre": "Le risque par trade et la règle du 1 %"}, {"n": 21, "titre": "Calculer la taille de sa position"}, {"n": 22, "titre": "Ratio risque / rendement et espérance mathématique"}, {"n": 23, "titre": "Drawdown, séries de pertes et risque de ruine"}]}, {"n": 5, "titre": "Construire une stratégie", "lecons": [{"n": 24, "titre": "L'anatomie d'un plan de trading"}, {"n": 25, "titre": "Stratégie 1 : le suivi de tendance"}, {"n": 26, "titre": "Stratégie 2 : la cassure (breakout)"}, {"n": 27, "titre": "Stratégie 3 : le retour à la moyenne"}, {"n": 28, "titre": "Le backtest : tester une stratégie sur le passé sans se mentir"}, {"n": 29, "titre": "Paper trading et journal de trading"}]}, {"n": 6, "titre": "Fondamentaux et macro", "lecons": [{"n": 30, "titre": "Le calendrier économique, les banques centrales et les taux"}, {"n": 31, "titre": "Les résultats d'entreprises et la saison des publications"}, {"n": 32, "titre": "Sentiment de marché, VIX et actualité"}, {"n": 33, "titre": "Les corrélations entre marchés (taux, dollar, or, actions)"}]}, {"n": 7, "titre": "La psychologie du trader", "lecons": [{"n": 34, "titre": "Les biais cognitifs qui coûtent cher"}, {"n": 35, "titre": "FOMO, revenge trading et overtrading"}, {"n": 36, "titre": "Discipline et routine du trader"}, {"n": 37, "titre": "Arnaques et pièges : signaux payants, copy trading, influenceurs, CFD"}]}, {"n": 8, "titre": "Pour aller plus loin", "lecons": [{"n": 38, "titre": "Les produits du trader : futures, options, CFD, turbos et warrants"}, {"n": 39, "titre": "Le trading algorithmique : les bases"}, {"n": 40, "titre": "Révision générale et construction de ton propre plan de trading"}]}], "lecons": {"1": {"titre": "Qu'est-ce que le trading ?", "html": "<h2>Pourquoi commencer par là<\/h2>\n<p>Le mot « trading » évoque des écrans pleins de courbes, des gains rapides et des vidéos de gens en voiture de sport. La réalité est beaucoup moins glamour : le trading, c'est <strong>un métier de gestion du risque<\/strong>, où l'on accepte de perdre souvent pour gagner un peu plus que ce qu'on perd. Avant d'apprendre la moindre technique, il faut savoir exactement à quel jeu on joue, contre qui, et avec quelles règles. C'est l'objet de cette leçon.<\/p>\n<h2>Trader, investir, spéculer : trois choses différentes<\/h2>\n<p>Les trois achètent et vendent des actifs financiers. Ce qui les distingue, c'est <strong>la source du gain espéré<\/strong> et <strong>la durée<\/strong>.<\/p>\n<ul><li><strong>Investir<\/strong>, c'est acheter un actif pour ce qu'il produit : les bénéfices d'une entreprise, les dividendes, les intérêts d'une obligation. L'investisseur garde des années. Il gagne si l'entreprise crée de la valeur (c'est exactement ce que tu vois dans le cours de finance).<\/li><li><strong>Trader<\/strong>, c'est acheter ou vendre pour profiter d'un <strong>mouvement de prix<\/strong>, sur une durée courte à moyenne (de quelques secondes à quelques semaines). Le trader se moque presque de ce que vaut l'entreprise : il cherche à prévoir où ira le prix, et surtout à gérer ce qui se passe s'il se trompe.<\/li><li><strong>Spéculer<\/strong>, au sens strict, c'est parier sur une évolution future. Tout trading est de la spéculation. Le mot devient péjoratif quand on parie <strong>sans méthode et sans limite de perte<\/strong>.<\/li><\/ul>\n<blockquote><p><strong>Une phrase pour s'en souvenir<\/strong> : l'investisseur achète une part d'entreprise, le trader achète un mouvement de prix.<\/p><\/blockquote>\n<h2>Le point qui change tout : un jeu à somme négative<\/h2>\n<p>Quand tu investis à long terme dans le marché actions, tu profites d'une richesse qui grandit : les entreprises font des bénéfices, l'économie croît. Tout le monde peut gagner en même temps. C'est un jeu à <strong>somme positive<\/strong>.<\/p>\n<p>Le trading à court terme est différent. Sur une journée, la valeur réelle d'Airbus ne change presque pas. Si tu gagnes 100 € en achetant à 150 € et en revendant à 152 €, quelqu'un d'autre a vendu trop tôt ou acheté trop tard. Avant frais, c'est un jeu à <strong>somme nulle<\/strong> : les gains des uns sont les pertes des autres.<\/p>\n<p>Et il y a des frais : commissions du courtier, <strong>spread<\/strong> (l'écart entre prix d'achat et prix de vente, on le verra en leçon 3), parfois frais de financement. Une fois les frais déduits, le trading est un jeu à <strong>somme négative<\/strong>. Pour gagner, il ne suffit pas d'être aussi bon que la moyenne : il faut être <strong>nettement meilleur<\/strong> que les autres participants.<\/p>\n<p>Et qui sont ces autres ? Des banques, des fonds, des algorithmes à haute fréquence, des traders professionnels avec de meilleures données, des coûts plus faibles et des années d'expérience.<\/p>\n<h3>Ce que disent les chiffres<\/h3>\n<p>En Europe, les courtiers qui proposent des <strong>CFD<\/strong> (des produits à effet de levier très utilisés par les particuliers) sont obligés d'afficher sur leur site le pourcentage de leurs clients particuliers qui perdent de l'argent. Le chiffre affiché tourne en général <strong>entre 70 % et 90 %<\/strong>. Va vérifier toi-même sur le site de n'importe quel courtier en CFD : la mention est obligatoire.<\/p>\n<p>Ce n'est pas pour te décourager. C'est pour fixer la règle du jeu dès la leçon 1 : <strong>la plupart des gens perdent, et ce cours sert d'abord à comprendre pourquoi<\/strong>, pour ne pas faire partie de ceux qui perdent bêtement.<\/p>\n<h2>Les quatre grands styles de trading<\/h2>\n<p>Ils se distinguent par la <strong>durée de détention<\/strong> d'une position (le temps entre l'achat et la revente).<\/p>\n<table><thead><tr><th>Style<\/th><th>Durée d'une position<\/th><th>Nombre de trades<\/th><th>Ce qu'il exige<\/th><\/tr><\/thead><tbody><tr><td><strong>Scalping<\/strong><\/td><td>quelques secondes à quelques minutes<\/td><td>des dizaines par jour<\/td><td>frais très bas, exécution rapide, concentration totale<\/td><\/tr><tr><td><strong>Day trading<\/strong><\/td><td>quelques minutes à quelques heures, tout est fermé le soir<\/td><td>quelques-uns par jour<\/td><td>être devant l'écran pendant les heures de marché<\/td><\/tr><tr><td><strong>Swing trading<\/strong><\/td><td>quelques jours à quelques semaines<\/td><td>quelques-uns par mois<\/td><td>une analyse le soir, des ordres placés à l'avance<\/td><\/tr><tr><td><strong>Position trading<\/strong><\/td><td>quelques semaines à quelques mois<\/td><td>quelques-uns par an<\/td><td>patience, accepter de fortes variations en cours de route<\/td><\/tr><\/tbody><\/table>\n<p>Plus la durée est courte, plus :<\/p>\n<ul><li>les <strong>frais pèsent lourd<\/strong> (tu les paies à chaque aller-retour) ;<\/li><li>le <strong>bruit<\/strong> domine (les petits mouvements au hasard comptent plus que la vraie tendance) ;<\/li><li>la <strong>concurrence des machines<\/strong> est forte.<\/li><\/ul>\n<p>C'est pour ça que, pour un étudiant qui ne peut pas passer ses journées devant un écran, le <strong>swing trading<\/strong> est en général le style le plus réaliste. C'est celui qu'on privilégiera dans les exemples de ce cours.<\/p>\n<h2>Les deux grandes familles d'analyse<\/h2>\n<p>Pour décider quand acheter et quand vendre, les traders s'appuient sur deux approches, souvent combinées.<\/p>\n<ul><li><strong>L'analyse technique<\/strong> étudie le <strong>prix et le volume<\/strong> eux-mêmes, sur des graphiques. Son idée : tout ce qui est connu est déjà dans le prix, et les comportements humains (peur, avidité) laissent des traces qui se répètent. Ce sera l'essentiel des modules 2 et 3.<\/li><li><strong>L'analyse fondamentale<\/strong> étudie <strong>ce qui fait bouger la valeur<\/strong> : résultats d'entreprise, taux d'intérêt, inflation, décisions des banques centrales. Ce sera le module 6, et ton cours de finance t'y prépare déjà.<\/li><\/ul>\n<p>Aucune des deux ne prédit l'avenir. Elles servent à repérer des situations où les chances sont un peu de ton côté.<\/p>\n<h2>Ce qui fait vraiment un trader qui dure<\/h2>\n<p>Si tu ne retiens qu'une idée du cours, retiens celle-ci : <strong>on ne gagne pas en ayant raison, on gagne en perdant peu quand on a tort.<\/strong><\/p>\n<p>Un trader qui gagne 40 % de ses trades peut être rentable s'il gagne en moyenne 3 € quand il a raison et perd 1 € quand il a tort. Un trader qui gagne 80 % de ses trades peut être ruiné si une seule perte efface vingt gains. Le module 4 (gestion du risque) est donc le plus important du cours, même s'il est le moins spectaculaire.<\/p>\n<p>Les trois piliers, qu'on retrouvera tout au long du programme :<\/p>\n<ol><li><strong>Une méthode<\/strong> : des règles écrites pour entrer et sortir, testées avant d'y mettre de l'argent.<\/li><li><strong>La gestion du risque<\/strong> : savoir avant chaque trade combien on accepte de perdre, et s'y tenir.<\/li><li><strong>La psychologie<\/strong> : appliquer les règles même quand on a peur ou qu'on a envie de se refaire.<\/li><\/ol>\n<h2>À retenir<\/h2>\n<ul><li><strong>Investir<\/strong> = profiter de la valeur créée par une entreprise, sur des années. <strong>Trader<\/strong> = profiter d'un mouvement de prix, sur une durée courte à moyenne.<\/li><li>Le trading à court terme est un jeu à <strong>somme nulle avant frais, et négative après frais<\/strong> : pour gagner, il faut être meilleur que la plupart des autres participants.<\/li><li><strong>70 à 90 %<\/strong> des comptes particuliers en CFD perdent de l'argent (mention obligatoire chez les courtiers européens).<\/li><li>Quatre styles : <strong>scalping, day trading, swing trading, position trading<\/strong>. Plus c'est court, plus les frais et le bruit pèsent.<\/li><li>Pour un étudiant, le <strong>swing trading<\/strong> est le style le plus réaliste.<\/li><li>On gagne en <strong>perdant peu quand on a tort<\/strong>, pas en ayant toujours raison.<\/li><\/ul>\n<h2>Exercice<\/h2>\n<ol><li>Pour chaque personne, dis s'il s'agit plutôt d'un <strong>investisseur<\/strong>, d'un <strong>day trader<\/strong>, d'un <strong>swing trader<\/strong> ou d'un <strong>scalper<\/strong> :<ol><li>Inès achète des actions TotalEnergies chaque mois depuis 5 ans pour toucher les dividendes.<\/li><li>Hugo achète l'action Renault le lundi après une forte baisse, et la revend 8 jours plus tard après un rebond.<\/li><li>Malik passe 200 ordres par jour sur le contrat à terme du DAX et garde chaque position moins de 2 minutes.<\/li><li>Clara achète du Bitcoin à 10h, le revend à 15h, et n'a jamais de position ouverte le soir.<\/li><\/ol><\/li><li>Hugo (le swing trader) fait <strong>10 allers-retours par mois<\/strong>. Chaque aller-retour lui coûte <strong>0,3 %<\/strong> de la somme engagée en frais et spread. Il engage <strong>2 000 €<\/strong> à chaque trade. Combien lui coûtent ses frais par mois ? Et par an ?<\/li><li>Malik (le scalper) fait <strong>200 allers-retours par jour<\/strong>, à <strong>2 €<\/strong> de frais chacun, sur 20 jours de bourse par mois. Combien doit-il gagner par mois <strong>juste pour couvrir ses frais<\/strong> ?<\/li><li><strong>Question de réflexion<\/strong> : un ami te dit qu'il « gagne 9 trades sur 10, donc il est forcément rentable ». Qu'est-ce que tu lui réponds ?<\/li><\/ol>\n<details>\n<summary>Corrigé (essaie d'abord !)<\/summary>\n<ol><li>Inès : <strong>investisseur<\/strong> (achat pour les dividendes, détention sur des années). Hugo : <strong>swing trader<\/strong> (8 jours). Malik : <strong>scalper<\/strong> (moins de 2 minutes, des centaines de trades). Clara : <strong>day trader<\/strong> (tout est fermé le soir).<\/li><li>Frais par trade : 2 000 × 0,3 % = <strong>6 €<\/strong>. Par mois : 10 × 6 = <strong>60 €<\/strong>. Par an : 60 × 12 = <strong>720 €<\/strong>. Si Hugo trade avec un capital de 2 000 €, il doit gagner 36 % par an juste pour revenir à zéro. Les frais sont le premier adversaire du trader.<\/li><li>200 × 2 € × 20 jours = <strong>8 000 € par mois<\/strong> de frais. Malik doit gagner 8 000 € chaque mois avant même de commencer à faire du bénéfice. C'est pour ça que le scalping n'est viable qu'avec des frais extrêmement bas, en général réservés aux professionnels.<\/li><li>Le taux de réussite seul ne dit rien. S'il gagne 10 € sur ses 9 bons trades (90 €) et perd 150 € sur le mauvais, il est <strong>perdant de 60 €<\/strong> sur 10 trades. Ce qui compte, c'est la combinaison du taux de réussite <strong>et<\/strong> du rapport entre gain moyen et perte moyenne. On appelle ça l'<strong>espérance mathématique<\/strong>, on la calculera précisément en leçon 22.<\/li><\/ol>\n<\/details>\n<hr>\n<p><em>Prochaine leçon : les marchés où l'on trade (actions, indices, forex, matières premières, cryptos) et leurs horaires.<\/em><\/p>", "minutes": 12}, "2": {"titre": "Les marchés et leurs horaires", "html": "<h2>Pourquoi c'est important<\/h2>\n<p>Hier, on a vu que trader, c'est profiter d'un mouvement de prix. Mais le prix de quoi ? Et quand ? On ne trade pas du pétrole comme on trade une action Airbus, et on ne trade pas à 3 h du matin comme à 15 h 30. Chaque marché a ses horaires, ses acteurs, sa façon de bouger. Choisir son marché, c'est souvent la première décision d'un trader, et elle dépend beaucoup de <strong>ton emploi du temps<\/strong>.<\/p>\n<h2>Les actions : posséder un morceau d'entreprise<\/h2>\n<p>Une <strong>action<\/strong> est une part du capital d'une entreprise. Quand tu achètes une action LVMH, tu deviens (un tout petit peu) propriétaire de LVMH. Son prix monte et baisse selon ce que les acheteurs et vendeurs pensent de l'avenir de l'entreprise : résultats, annonces, actualité du secteur.<\/p>\n<p>Les actions s'échangent sur des <strong>bourses<\/strong> :<\/p>\n<ul><li><strong>Euronext Paris<\/strong> pour les actions françaises (TotalEnergies, LVMH, Airbus...) ;<\/li><li>le <strong>NYSE<\/strong> et le <strong>Nasdaq<\/strong> à New York pour les actions américaines (Apple, Microsoft, Nvidia...) ;<\/li><li>la <strong>Deutsche Börse<\/strong> (Xetra) à Francfort, le <strong>London Stock Exchange<\/strong>, la bourse de Tokyo, etc.<\/li><\/ul>\n<p><strong>Ce qui caractérise les actions<\/strong> : chaque titre a sa propre histoire. Une action peut bondir de 10 % ou chuter de 20 % en une séance le jour de ses résultats, même si le reste du marché ne bouge pas.<\/p>\n<h2>Les indices : la météo d'un marché<\/h2>\n<p>Un <strong>indice<\/strong> est un panier d'actions qui résume l'état d'un marché. C'est un thermomètre.<\/p>\n<table><thead><tr><th>Indice<\/th><th>Ce qu'il mesure<\/th><\/tr><\/thead><tbody><tr><td><strong>CAC 40<\/strong><\/td><td>les 40 plus grandes entreprises cotées à Paris<\/td><\/tr><tr><td><strong>DAX 40<\/strong><\/td><td>les 40 plus grandes entreprises allemandes<\/td><\/tr><tr><td><strong>Euro Stoxx 50<\/strong><\/td><td>les 50 plus grandes de la zone euro<\/td><\/tr><tr><td><strong>S&amp;P 500<\/strong><\/td><td>500 grandes entreprises américaines, la référence mondiale<\/td><\/tr><tr><td><strong>Nasdaq 100<\/strong><\/td><td>les 100 plus grandes valeurs du Nasdaq, très chargé en technologie<\/td><\/tr><\/tbody><\/table>\n<p>Tu ne peux pas « acheter un indice » directement : c'est un calcul, pas un objet. Pour le trader, on passe par un produit qui le réplique : un <strong>ETF<\/strong> (un fonds coté qui copie l'indice), un <strong>contrat à terme<\/strong> (future) ou un <strong>CFD<\/strong>. On détaillera ces produits en leçon 38.<\/p>\n<p><strong>Pourquoi les traders aiment les indices<\/strong> : ils sont très <strong>liquides<\/strong> (énormément d'acheteurs et de vendeurs), et un indice ne peut pas faire faillite ni perdre 50 % sur une mauvaise nouvelle d'une seule entreprise. Ses mouvements sont plus « propres » que ceux d'une action isolée.<\/p>\n<h2>Le forex : le marché des devises<\/h2>\n<p>Le <strong>forex<\/strong> (<em>foreign exchange<\/em>) est le marché où l'on échange une monnaie contre une autre. C'est de loin le plus gros marché financier du monde : selon l'enquête de la Banque des règlements internationaux de 2022, il s'y échangeait <strong>plus de 7 500 milliards de dollars par jour<\/strong>.<\/p>\n<p>On y trade des <strong>paires<\/strong> de devises. La plus échangée est <strong>EUR/USD<\/strong> :<\/p>\n<blockquote><p><strong>EUR/USD = 1,0850<\/strong> signifie que <strong>1 euro vaut 1,0850 dollar<\/strong>.<\/p><p>Si tu penses que l'euro va monter face au dollar, tu <strong>achètes<\/strong> EUR/USD. Si tu penses qu'il va baisser, tu le <strong>vends<\/strong>.<\/p><\/blockquote>\n<p>Les devises bougent peu en pourcentage : une variation de 1 % de l'EUR/USD dans la journée est déjà un gros mouvement. C'est pour ça que le forex est presque toujours tradé avec <strong>effet de levier<\/strong>, ce qui le rend très dangereux pour les débutants (leçon 6). L'unité de mouvement s'appelle le <strong>pip<\/strong> : pour l'EUR/USD, c'est le 4e chiffre après la virgule (0,0001).<\/p>\n<p><strong>Ce qui fait bouger les devises<\/strong> : les <strong>taux d'intérêt<\/strong> des banques centrales (BCE, Fed), l'inflation, la croissance, la politique. On y reviendra au module 6.<\/p>\n<h2>Les matières premières<\/h2>\n<p>Or, argent, pétrole (Brent pour l'Europe, WTI pour les États-Unis), gaz, blé, cuivre, café... On les appelle aussi <em>commodities<\/em>. Elles se tradent surtout via des <strong>contrats à terme<\/strong> sur des bourses comme le <strong>CME<\/strong> à Chicago, ou via des CFD et des ETF.<\/p>\n<ul><li><strong>L'or<\/strong> sert de valeur refuge : il a tendance à monter quand les investisseurs ont peur ou quand les taux réels baissent.<\/li><li><strong>Le pétrole<\/strong> réagit à la géopolitique (Moyen-Orient, Russie), aux décisions de l'OPEP+ et à la santé de l'économie mondiale. Il peut être très violent : en avril 2020, en plein Covid, le contrat WTI de mai est même passé <strong>sous zéro<\/strong> pendant quelques heures, parce que plus personne n'avait de place pour stocker le pétrole livré.<\/li><\/ul>\n<h2>Les cryptomonnaies<\/h2>\n<p>Bitcoin, Ethereum et des milliers d'autres. Elles s'échangent sur des <strong>plateformes<\/strong> (Binance, Coinbase, Kraken...) et non sur une bourse réglementée comme Euronext.<\/p>\n<p>Deux particularités :<\/p>\n<ol><li><strong>Elles ne ferment jamais<\/strong> : 24 h/24, 7 j/7
